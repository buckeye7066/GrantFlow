# SearXNG settings for GrantFlow's self-hosted web search.
# Key change vs. stock: the JSON output format is ENABLED (stock ships HTML-only),
# which the GrantFlow backend requires (it calls /search?format=json).
use_default_settings: true

server:
  # Overridden by the SEARXNG_SECRET env var on the Railway service.
  secret_key: "set-via-SEARXNG_SECRET-env"
  # This instance is internal-only (called by the GrantFlow backend), not public,
  # so disable the bot limiter that would otherwise throttle our own backend.
  limiter: false
  image_proxy: false

search:
  # Enabling json is the whole point — without it /search?format=json returns 403.
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""
  # Recover suspended engines FAST. Stock defaults park an engine for 1-24h
  # after a 429/CAPTCHA — with our datacenter egress IP that meant every
  # default engine was perma-suspended within minutes of a restart, and the
  # instance returned 200 + zero results for everything (the 2026-07 web-lane
  # outage: hyperlocal coverage silently dead for 3+ days).
  suspended_times:
    SearxEngineTooManyRequests: 300
    SearxEngineCaptcha: 3600
    SearxEngineAccessDenied: 3600

outgoing:
  # SearXNG waits for the SLOWEST engine (up to its timeout) before returning the
  # aggregated response. The GrantFlow backend gives each web query an 8s budget
  # (searxngProvider), so if SearXNG itself can take ~8-12s, EVERY query times out
  # on attempt 1 and only succeeds on the retry — doubling latency and starving the
  # gateway crawl budget (observed 2026-07-23 right after enabling google/brave).
  # Cap SearXNG below the client's 8s so it returns the fast engines' results
  # (google/brave/bing answer in 1-4s) instead of blocking on a slow straggler.
  request_timeout: 5.0
  max_request_timeout: 7.0

# Engine mix for a DATACENTER egress IP, tuned against MEASURED per-engine health
# on this Railway instance (5-query probe, 2026-07-23), not assumptions.
#
# RELIABLE CORE (fire on every query — these carry funding recall):
#   google, startpage, qwant, bing — together the major distinct web indices, so
#   coverage is effectively complete for local/foundation/scholarship queries.
# BEST-EFFORT (independent index; rate-limits under load but self-recovers via the
#   short suspended_times above, so it adds unique results when available):
#   brave.
# DISABLED — cannot fire from a datacenter IP, so leaving them on only spends the
#   occasional re-attempt after a suspension expires (each measured 5/5 failing
#   with a HARD reason, not a transient rate-limit):
#   - duckduckgo: CAPTCHA-walls DC IPs (and is Bing-backed → redundant with bing).
#   - mojeek:     actively blocks DC scraping ("access denied").
#   - yahoo:      "HTTP protocol error" — the engine itself is broken in this image
#                 (a bug, not an IP block), so it never returns results.
engines:
  - name: google
    disabled: false
    timeout: 6.0
  - name: startpage
    disabled: false
    timeout: 6.0
  - name: bing
    disabled: false
    timeout: 6.0
  - name: qwant
    disabled: false
    timeout: 6.0
  - name: brave
    disabled: false
    timeout: 6.0
  - name: mojeek
    disabled: true
  - name: yahoo
    disabled: true
  - name: duckduckgo
    disabled: true

general:
  instance_name: "grantflow-search"
