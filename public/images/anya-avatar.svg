<?xml version="1.0" encoding="UTF-8"?>
<!-- Anya — Administrative Assistant. Friendly flat-illustration portrait of a
     young woman (late 20s). Vector (not a photo); intentionally warm + human. -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anya, Administrative Assistant">
  <defs>
    <clipPath id="circle"><circle cx="256" cy="256" r="256"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C5CFC"/>
      <stop offset="1" stop-color="#5B8DEF"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7B4A24"/>
      <stop offset="1" stop-color="#9A6531"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#circle)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- shoulders / blazer (professional) -->
    <path d="M104 512c0-78 68-128 152-128s152 50 152 128z" fill="#2E3A59"/>
    <path d="M236 392h40l-8 44-12 14-12-14z" fill="#F4C9A8"/>
    <path d="M236 392c0 26 9 44 20 44s20-18 20-44l-4 10c-5 9-27 9-32 0z" fill="#EBB892"/>
    <!-- hair back -->
    <path d="M150 250c0-78 47-132 106-132s106 54 106 132c0 44-6 92-18 120l-22-30c10-26 12-66 12-92 0-58-34-92-78-92s-78 34-78 92c0 26 2 66 12 92l-22 30c-12-28-18-76-18-120z" fill="url(#hair)"/>
    <!-- neck -->
    <rect x="240" y="356" width="32" height="48" rx="16" fill="#EBB892"/>
    <!-- face -->
    <path d="M178 248c0-52 35-90 78-90s78 38 78 90c0 60-35 108-78 108s-78-48-78-108z" fill="#F4C9A8"/>
    <!-- ears -->
    <circle cx="180" cy="262" r="14" fill="#F4C9A8"/>
    <circle cx="332" cy="262" r="14" fill="#F4C9A8"/>
    <!-- hair front / side-swept fringe -->
    <path d="M170 246c-6-70 40-118 86-118s92 46 86 118c-4-34-16-58-34-70-6 22-26 40-58 44-26 3-46 12-58 26-10 12-18 38-22 0z" fill="url(#hair)"/>
    <path d="M256 130c40 0 74 30 84 74-18-28-50-44-84-44s-66 16-84 44c10-44 44-74 84-74z" fill="#8A5628"/>
    <!-- brows -->
    <path d="M204 244c10-7 26-7 36 0" stroke="#6E4423" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M272 244c10-7 26-7 36 0" stroke="#6E4423" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- eyes -->
    <ellipse cx="222" cy="266" rx="11" ry="13" fill="#fff"/>
    <ellipse cx="290" cy="266" rx="11" ry="13" fill="#fff"/>
    <circle cx="224" cy="268" r="6.5" fill="#3C6E71"/>
    <circle cx="292" cy="268" r="6.5" fill="#3C6E71"/>
    <circle cx="226" cy="266" r="2" fill="#fff"/>
    <circle cx="294" cy="266" r="2" fill="#fff"/>
    <!-- nose -->
    <path d="M256 276c-4 12-8 20-2 26 3 3 7 3 10 0" stroke="#E0A988" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- smile -->
    <path d="M236 312c12 12 28 12 40 0" stroke="#C9706A" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- cheeks -->
    <circle cx="206" cy="296" r="10" fill="#F6B9A6" opacity="0.5"/>
    <circle cx="308" cy="296" r="10" fill="#F6B9A6" opacity="0.5"/>
  </g>
</svg>
