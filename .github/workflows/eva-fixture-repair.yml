name: EVA fixture repair
on:
  push:
    branches: ['fix/2026-09-06-report-repairs']
    paths: ['.github/workflows/eva-fixture-repair.yml']
permissions:
  contents: write
jobs:
  fixture:
    if: github.ref == 'refs/heads/fix/2026-09-06-report-repairs'
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Pin fixture line endings without changing machine Git settings
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('tools/eva-edge-runner/test/gitState.test.mjs')
          source = p.read_text(encoding='utf-8')
          def blob(s):
              data = s.encode('utf-8')
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert blob(source) == '221a170c19414ae3e7962be3ceef54b7eab018fc'
          old = "    writeFileSync(join(source, 'app.txt'), 'main-v1\\n')\n    realGit(source, ['add', 'app.txt'])"
          new = "    // The fixture commits exact LF bytes on every platform; a Windows host's\n    // global autocrlf setting must not change the isolation assertions.\n    writeFileSync(join(source, '.gitattributes'), 'app.txt text eol=lf\\n')\n    writeFileSync(join(source, 'app.txt'), 'main-v1\\n')\n    realGit(source, ['add', '.gitattributes', 'app.txt'])"
          assert source.count(old) == 1
          result = source.replace(old, new)
          assert blob(result) == 'fbf8d996aa27fbc4a0b7b18167096a9d4beebd54'
          p.write_bytes(result.encode('utf-8'))
          PY
      - name: Run full EVA safeguards on Windows
        working-directory: tools/eva-edge-runner
        run: npm test
      - name: Commit only the verified fixture repair
        shell: bash
        run: |
          git add tools/eva-edge-runner/test/gitState.test.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(eva): pin fixture LF bytes across Windows Git settings'
          git push origin HEAD:refs/heads/fix/2026-09-06-report-repairs
