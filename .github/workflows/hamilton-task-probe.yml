name: hamilton-task-probe

# Manual only. Read-only aggregate probe of production application_tasks /
# grants, used to verify Hamilton autopilot defect reports against the real
# database. Uses the same scoped, expiring, read-only `grantflow_auditor` role
# as production-audit.yml and the same environment secret. It never writes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hamilton-task-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Probe production task lifecycle (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-audit

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc

      - name: Install the Postgres client only
        run: npm install --no-save --no-audit --no-fund pg@8

      - name: Run the read-only probe
        env:
          GRANTFLOW_PROD_AUDIT_DATABASE_URL: ${{ secrets.GRANTFLOW_PROD_AUDIT_DATABASE_URL }}
        run: node scripts/production-audit/hamilton-task-probe.mjs --out ./probe-out

      - name: Upload the probe artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hamilton-task-probe
          path: ./probe-out
          retention-days: 7
