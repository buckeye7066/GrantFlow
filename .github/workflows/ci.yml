name: CI

on:
  pull_request:
  push:
    branches: [main]

# Supersede in-flight runs on the SAME branch. Agent branches push repeatedly
# (14 runs against one branch inside a single hour on 2026-07-30), and every
# superseded run kept burning four jobs' worth of Actions minutes toward the
# spending cap that halted CI account-wide on 2026-07-29.
#
# main is deliberately EXEMPT — via a UNIQUE group per commit, not merely
# cancel-in-progress:false. A shared group still allows only ONE pending run,
# so under rapid merges a third push DISPLACES the second commit's queued run
# and that commit loses its verification record (observed live 2026-07-31:
# 3d635fa4's main run was cancelled by the next merge minutes after this
# guard shipped). A per-sha group means main runs never queue against each
# other, so every commit on main keeps its own completed record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --include=optional

      - name: Vite production build (Vercel parity)
        run: npm run build

      - name: Detect code corruption
        run: |
          echo "Checking for code corruption patterns..."
          node scripts/detect-code-corruption.mjs || {
            echo ""
            echo "CODE CORRUPTION DETECTED - See above for details"
            exit 1
          }

      - name: Secret scan
        run: npm run scan:secrets

      - name: Audit (high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Release gates
        run: npm run release:gates

  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grantflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/grantflow_ci
      DB_PROVIDER: postgres
      DB_DIALECT: postgres
      NODE_ENV: development

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --include=optional

      - name: Migrate fresh database (full chain)
        run: npm run migrate

      - name: Re-run migrate (must be idempotent)
        run: npm run migrate

      - name: Verify canonical Postgres schema
        run: node backend/scripts/verify-pg-schema.mjs

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grantflow_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: 'true'
      NODE_ENV: development
      SMOKE_MODE: 'true'
      PORT: '8080'
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/grantflow_smoke
      DB_PROVIDER: postgres
      DB_DIALECT: postgres
      MIGRATE_ON_BOOT: 'false'
      DB_AUTO_MIGRATE: 'false'
      ALLOW_EPHEMERAL_UPLOADS: 'true'
      UPLOADS_DIR: /tmp/grantflow-smoke-uploads
      AUTH_JWT_SECRET: grantflow-ci-browser-smoke-secret-not-for-production
      ADMIN_TOKEN: grantflow-ci-browser-smoke-admin-token
      # MUST stay quoted: unquoted, YAML reads these 64 digits as a number and
      # the value reaches Node as "4.444444444444445e+63", which is neither hex
      # nor base64 — runtimeSecrets then aborts boot with a FATAL.
      RUNTIME_SECRETS_KEY: '4444444444444444444444444444444444444444444444444444444444444444'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev --include=optional

      # The smoke suite drives the real Express server, which serves the SPA from
      # dist/. Without this the server answers every route with
      # ENOENT ... dist/index.html and all 10 specs fail on a blank page.
      - name: Build frontend for the server to serve
        run: npm run build

      - name: Prepare PostgreSQL schema
        run: |
          npm run migrate
          node backend/scripts/verify-pg-schema.mjs
          mkdir -p "$UPLOADS_DIR"

      - name: Install Playwright Chromium
        run: node ./node_modules/playwright/cli.js install chromium --with-deps

      - name: Blocking Playwright critical-path smoke
        run: npm run smoke

      - name: Retain Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-smoke-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grantflow_container_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build exact production Docker image
        run: docker build --pull --tag grantflow:ci .

      - name: Boot image against PostgreSQL and verify health
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/grantflow_container_ci
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/grantflow-uploads"
          docker run --detach --name grantflow-ci --network host \
            --volume "$RUNNER_TEMP/grantflow-uploads:/data/uploads" \
            --env NODE_ENV=production \
            --env PORT=8080 \
            --env DATABASE_URL="$DATABASE_URL" \
            --env DB_PROVIDER=postgres \
            --env DB_DIALECT=postgres \
            --env MIGRATE_ON_BOOT=true \
            --env DB_AUTO_MIGRATE=false \
            --env GRANTFLOW_SKIP_MISSION_GATE=true \
            --env UPLOADS_DIR=/data/uploads \
            --env AUTH_JWT_SECRET=grantflow-ci-container-secret-not-for-production \
            --env ADMIN_TOKEN=grantflow-ci-container-admin-token \
            --env RUNTIME_SECRETS_KEY=5555555555555555555555555555555555555555555555555555555555555555 \
            grantflow:ci

          cleanup() {
            docker logs grantflow-ci || true
            docker rm --force grantflow-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/healthz >/tmp/healthz.json; then
              break
            fi
            sleep 2
          done

          curl --fail --silent --show-error http://127.0.0.1:8080/healthz | tee /tmp/healthz-final.json
          curl --fail --silent --show-error http://127.0.0.1:8080/readyz | tee /tmp/readyz-final.json
          curl --fail --silent --show-error http://127.0.0.1:8080/api/health | tee /tmp/api-health-final.json

          process_uid="$(docker exec grantflow-ci sh -c "awk '/^Uid:/{print \$2}' /proc/1/status")"
          test "$process_uid" != "0"

          for attempt in $(seq 1 30); do
            health="$(docker inspect --format '{{.State.Health.Status}}' grantflow-ci)"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            if [ "$health" = "unhealthy" ]; then
              exit 1
            fi
            sleep 2
          done
          echo "Container healthcheck did not become healthy"
          exit 1
