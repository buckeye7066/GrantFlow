name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        # Work around occasional npm optional-deps resolution issues (rollup native bindings used by Vite).
        # Keep CI lockfile-only so it validates the committed dependency graph.
        run: npm ci --include=optional

      # Same command Vercel runs; fail in minutes instead of after full unit + release gates.
      - name: Vite production build (Vercel parity)
        run: npm run build

      - name: Detect code corruption
        # Early detection of common automated code fixer corruption patterns before
        # running full test suite. This gives clearer error messages for duplicate
        # declarations, undefined variables, and parsing errors that are commonly
        # introduced by AI assistants and similar automated tools.
        run: |
          echo "Checking for code corruption patterns..."
          node scripts/detect-code-corruption.mjs || {
            echo ""
            echo "CODE CORRUPTION DETECTED - See above for details"
            echo "This is likely caused by automated code fixers."
            echo "The corrupted code must be fixed before CI can pass."
            exit 1
          }

      - name: Secret scan
        # This is blocking on purpose: production readiness cannot depend on
        # someone noticing leaked credentials after a deploy.
        run: npm run scan:secrets

      - name: Audit (high+)
        # Blocking for production dependencies; missing fixes should be explicit,
        # not silently bypassed by CI.
        run: npm audit --omit=dev --audit-level=high

      - name: Release gates
        run: npm run release:gates

      - name: Playwright smoke
        # Non-blocking: smoke tests require a running database (Postgres) which is not
        # available in CI yet. The step still runs to surface issues but won't block CI.
        # Step-level timeout prevents Playwright install from exhausting the job timeout.
        continue-on-error: true
        timeout-minutes: 5
        env:
          ALLOW_EPHEMERAL_UPLOADS: 'true'
        run: |
          npx playwright install chromium --with-deps 2>/dev/null || npm run smoke:install
          npm run smoke

  # Replays the full Postgres migration chain against an ephemeral database on
  # every PR. Production runs Postgres (Railway) but the unit suite runs on
  # in-memory SQLite, so dialect-only migration bugs (TEXT-vs-JSONB drift,
  # missing ADD COLUMN, tables never ported from the SQLite set, boolean=integer
  # comparisons) were invisible until a real deploy/restore. This job is the
  # guard: a fresh `npm run migrate` must apply cleanly, be idempotent on
  # re-run, and produce the canonical schema.
  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grantflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/grantflow_ci
      DB_PROVIDER: postgres
      DB_DIALECT: postgres
      NODE_ENV: development

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --include=optional

      - name: Migrate fresh database (full chain)
        run: npm run migrate

      - name: Re-run migrate (must be idempotent)
        run: npm run migrate

      - name: Verify canonical Postgres schema
        run: node backend/scripts/verify-pg-schema.mjs
