name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        # Work around occasional npm optional-deps resolution issues (rollup native bindings used by Vite).
        # Explicitly include optional deps so `vite build` doesn't fail with missing @rollup/* binaries.
        run: npm ci --include=optional

      - name: Audit (high+)
        run: npm audit --audit-level=high

      - name: Release gates
        run: npm run release:gates

