name: Verify pagination recovery
on:
  push:
    branches: [recovery/propublica-pagination-20260909]
    paths: [.github/workflows/recovery-pagination.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/recovery/propublica-pagination-20260909'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: recovery/propublica-pagination-20260909
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - name: Apply guarded source-only manifest
        shell: python
        run: |
          import base64, bz2, hashlib, json, pathlib
          raw = bz2.decompress(base64.b64decode(pathlib.Path('.recovery-pagination.b64').read_text().strip(), validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'a3e6ac03e899efee78d892cab190b74cf439a1f255ba0da7fb6df5f0718a1025', 'Manifest integrity mismatch'
          allowed = {'backend/services/yana/yanaProspectSources.js', 'backend/src/integrations/httpClient.js', 'backend/src/integrations/propublica990.js', 'backend/tests/propublicaPaginationRecovery.test.js', 'docs/agent-sync/2026-09-09-propublica-pagination.md'}
          prepared = []
          for change in json.loads(raw):
              assert change['path'] in allowed
              p = pathlib.Path(change['path'])
              old = p.read_bytes() if p.exists() else None
              assert (hashlib.sha256(old).hexdigest() if old is not None else None) == change['before'], f'Source moved: {p}'
              lines = (old or b'').decode().splitlines(keepends=True)
              for start, end, replacement in reversed(change['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = replacement.splitlines(keepends=True)
              new = ''.join(lines).encode()
              assert hashlib.sha256(new).hexdigest() == change['after'], f'Patched content mismatch: {p}'
              prepared.append((p, new))
          assert {str(p) for p, _ in prepared} == allowed
          for p, new in prepared:
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(new)
          pathlib.Path('/tmp/recovery-paths.json').write_text(json.dumps([str(p) for p, _ in prepared]))
          print('Applied five source/test/doc files with before/after SHA-256 verification.')
      - run: npm ci
      - name: Reproducing and related regression checks
        run: |
          node node_modules/vitest/vitest.mjs run backend/tests/propublicaPaginationRecovery.test.js backend/tests/yanaLeadDiscovery.test.js backend/tests/foundation990ProfileDriven.test.js
          node --test tests/unit/funding-provider-clients.test.mjs tests/unit/yana-prospect-discovery.test.mjs
      - name: Complete pre-push gates
        run: npm run check:prepush
      - name: Commit verified repair to isolated recovery branch only
        shell: python
        run: |
          import json, pathlib, subprocess
          paths = json.loads(pathlib.Path('/tmp/recovery-paths.json').read_text())
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', 'rm', '--', '.recovery-pagination.b64'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: recover ProPublica query pagination without retrying deterministic HTTP failures'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:recovery/propublica-pagination-20260909'], check=True)
          subprocess.run(['git', 'rev-parse', 'HEAD'], check=True)
