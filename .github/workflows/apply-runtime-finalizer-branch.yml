name: Apply runtime finalizer correction

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: write

concurrency:
  group: apply-runtime-finalizer-correction
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'agent/finish-runtime-finalizer-20260729'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact correction branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/finish-runtime-finalizer-20260729
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=optional

      - name: Apply deterministic runtime correction
        run: python scripts/production-audit-runtime-finalizer.py

      - name: Run focused regressions
        run: |
          node --test tests/unit/anya-chat-hook-order.test.mjs
          npm exec -- vitest run backend/tests/portalCheckLegacyHonesty.test.js backend/tests/portalCheckService.test.js --reporter=verbose

      - name: Run pre-push quality gates
        run: npm run check:prepush

      - name: Run secret scan
        run: npm run scan:secrets

      - name: Run complete release gates
        run: npm run release:gates

      - name: Remove one-shot scaffolding
        run: |
          rm -f .github/workflows/apply-runtime-finalizer-branch.yml
          rm -f .github/workflows/production-audit-runtime-finalizer.yml
          rm -f scripts/production-audit-runtime-finalizer.py
          git diff --check

      - name: Commit verified runtime correction
        run: |
          set -euo pipefail
          git config user.name "grantflow-runtime-finalizer[bot]"
          git config user.email "grantflow-runtime-finalizer[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(audit): close Dashboard hook crash and legacy portal claims"
          git push origin HEAD:agent/finish-runtime-finalizer-20260729
