name: Apply GrantFlow migration checksum integrity

on:
  push:
    branches:
      - chatgpt/production-ready/grantflow
    paths:
      - scripts/apply-grantflow-migration-checksums.mjs
      - .github/workflows/apply-grantflow-migration-checksums.yml

permissions:
  contents: write

concurrency:
  group: apply-grantflow-migration-checksums
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grantflow_checksum_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/grantflow_checksum_ci
      DB_PROVIDER: postgres
      DB_DIALECT: postgres
      NODE_ENV: development

    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/production-ready/grantflow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm

      - name: Apply asserted migration-ledger patch
        run: node scripts/apply-grantflow-migration-checksums.mjs

      - name: Validate generated source before install
        run: |
          git diff --check
          node --check backend/db/migrate.js
          node --check backend/db/migrationIntegrity.js
          node --check shared/releaseIdentity.js
          node --check tests/unit/migration-integrity.test.mjs
          node --check tests/unit/release-identity.test.mjs

      - name: Install locked dependencies
        run: npm ci --include=dev --include=optional

      - name: Run focused checksum and release-identity tests
        run: >-
          node --test
          tests/unit/migration-integrity.test.mjs
          tests/unit/release-identity.test.mjs
          tests/unit/deployment-version-contract.test.mjs

      - name: Apply the full PostgreSQL migration chain
        run: npm run migrate

      - name: Re-run migrations and verify schema
        run: |
          npm run migrate
          node backend/scripts/verify-pg-schema.mjs

      - name: Verify fresh-database checksum identity
        run: |
          node --input-type=module <<'NODE'
          import { getDb } from './backend/db/index.js'
          import {
            buildDatabaseMigrationIdentity,
            buildRepositoryReleaseIdentity,
          } from './shared/releaseIdentity.js'

          const db = await getDb()
          try {
            const releaseIdentity = buildRepositoryReleaseIdentity({
              commit: process.env.GITHUB_SHA || null,
              useCache: false,
            })
            const identity = await buildDatabaseMigrationIdentity(db, { releaseIdentity })
            console.log(JSON.stringify(identity, null, 2))
            if (!identity.matches_release) throw new Error('fresh database does not match release migration set')
            if (!identity.historical_applied_bytes_attested) {
              throw new Error('fresh database migration rows were not recorded from applied bytes')
            }
            if (identity.checksum_missing.length || identity.checksum_mismatches.length) {
              throw new Error('fresh database contains incomplete or mismatched migration checksums')
            }
          } finally {
            await db.close?.()
          }
          NODE

      - name: Run full lint, typecheck, and production build
        run: |
          npm run lint:ci
          npm run typecheck
          npm run build

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/apply-grantflow-migration-checksums.mjs
          rm .github/workflows/apply-grantflow-migration-checksums.yml

      - name: Commit validated migration checksum integrity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(release): attest applied migration checksums"
          git push origin HEAD:chatgpt/production-ready/grantflow
