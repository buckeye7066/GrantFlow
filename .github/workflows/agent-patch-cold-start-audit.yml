name: Preserve read-only audit score parity

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/qa-36-remaining-gaps-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qa-36-remaining-gaps-v2
          fetch-depth: 0

      - name: Keep the persisted-score audit SELECT-only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/routes/fundingSources.js')
          text = path.read_text(encoding='utf-8')
          old = '    if (presented.total === 0) {'
          new = '    if (!readOnlyAudit && presented.total === 0) {'
          if text.count(old) != 1:
              raise SystemExit(f'expected one cold-start branch, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/agent-patch-cold-start-audit.yml').unlink()
          PY

      - name: Commit audit guard
        shell: bash
        run: |
          git config user.name "GrantFlow Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/routes/fundingSources.js .github/workflows/agent-patch-cold-start-audit.yml
          git commit -m "fix(audit): keep cold-start fallback out of score-parity reads"
          git push origin HEAD:fix/qa-36-remaining-gaps-v2
