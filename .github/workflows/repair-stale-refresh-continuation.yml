name: Verify and reconcile stored-refresh continuation
on:
  push:
    branches: [fix/stale-refresh-batch-honesty]
    paths:
      - 'scripts/repair-stale-refresh-*'
      - '.github/workflows/repair-stale-refresh-continuation.yml'
permissions:
  contents: write
concurrency:
  group: repair-stale-refresh-continuation
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'buckeye7066/GrantFlow'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      RUNTIME_SECRETS_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Reproduce missing behavior on unchanged main
        run: node scripts/repair-stale-refresh-continuation.mjs red
      - name: Apply bounded existing-scheduler repair
        run: node scripts/repair-stale-refresh-continuation.mjs apply
      - name: Verify new and preserved behavior
        run: node scripts/repair-stale-refresh-continuation.mjs verify
      - name: Check source and runtime contracts
        run: npm run lint && npm run typecheck && npm run crawler-os:lint && node scripts/codemod/safe-sql.mjs
      - name: Publish tested source to this branch only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=fix/stale-refresh-batch-honesty
          actual=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git diff --check
          git config user.name buckeye7066
          git config user.email 220653752+buckeye7066@users.noreply.github.com
          git add backend/server.js backend/startup/enforceInvariants.js backend/services/matching/staleMatchExplainRefresh.js backend/services/matching/staleMatchRefreshReceipt.js backend/services/sam/samRegistry.js backend/tests/staleMatchRefreshContinuation.test.js backend/tests/staleMatchExplainScheduler.test.js docs/agent-sync/2026-09-18-stored-refresh-follow-through.md
          git commit -m 'fix(matching): resume bounded refresh with durable current diagnostics'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
