name: One-shot PR 1173 sync main

on:
  push:
    branches:
      - fix/ssrf-egress-chokepoint-payment-cap-otp-csprng

permissions:
  contents: write

jobs:
  sync-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[sync-main-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/ssrf-egress-chokepoint-payment-cap-otp-csprng
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.20.2
          cache: npm

      - name: Merge current main locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GrantFlow Security Repair"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Verify environment contracts
        run: node scripts/check-env-examples.mjs

      - name: Run focused security regressions
        run: >-
          node scripts/run-vitest-isolated.mjs run
          backend/tests/safeFetchSsrf.test.js
          backend/tests/paymentAuthorizationCap.test.js

      - name: Run repository pre-push gates
        run: npm run check:prepush

      - name: Remove one-shot workflow and publish verified sync
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-pr1173-sync-main.yml
          git commit -m "chore(security): verify against current main [sync-main-complete]"
          git push origin HEAD:fix/ssrf-egress-chokepoint-payment-cap-otp-csprng
