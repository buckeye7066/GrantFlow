name: Verify PR 1179 structured soft repair

on:
  push:
    branches:
      - fix/match-authority-soft-penalty-and-display-parity

permissions:
  contents: write

jobs:
  verify-and-publish:
    if: ${{ !contains(github.event.head_commit.message, '[structured-soft-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout matching branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/match-authority-soft-penalty-and-display-parity
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.20.2
          cache: npm

      - name: Apply staged structured eligibility repair
        run: node scripts/one-shot-pr1179-structured-soft-fix.mjs

      - name: Parse-check modified files
        run: |
          node --check backend/services/relevanceFilter.js
          node --check backend/services/matching/profileSpecificGate.js
          node --check backend/tests/profileSpecificGateStructuredEligibility.test.js

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run focused matching and display regressions
        run: >-
          node scripts/run-vitest-isolated.mjs run
          backend/tests/profileSpecificGateStructuredEligibility.test.js
          backend/tests/relevanceFilter.softMode.test.js
          backend/tests/profileSpecificGateSurfacing.test.js
          backend/tests/matchEngineSoftRelevanceAndMatchFunds.test.js

      - name: Run repository pre-push gates
        run: npm run check:prepush

      - name: Publish exactly the verified sources
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/one-shot-pr1179-structured-soft-fix.mjs
          git rm .github/workflows/verify-pr1179-structured-soft-artifact.yml
          git add \
            backend/services/relevanceFilter.js \
            backend/services/matching/profileSpecificGate.js \
            backend/tests/profileSpecificGateStructuredEligibility.test.js
          GIT_AUTHOR_NAME="GrantFlow Match Repair" \
          GIT_AUTHOR_EMAIL="actions@users.noreply.github.com" \
          GIT_COMMITTER_NAME="GrantFlow Match Repair" \
          GIT_COMMITTER_EMAIL="actions@users.noreply.github.com" \
            git commit -m "fix(match): preserve structured soft relevance [structured-soft-complete]"
          git push origin HEAD:fix/match-authority-soft-penalty-and-display-parity
