name: Verify PR 1179 structured soft artifact

on:
  push:
    branches:
      - fix/match-authority-soft-penalty-and-display-parity

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout matching branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.20.2
          cache: npm

      - name: Apply exact structured eligibility and display fixes
        run: node scripts/one-shot-pr1179-structured-soft-fix.mjs

      - name: Parse-check modified files
        run: |
          node --check backend/services/relevanceFilter.js
          node --check backend/services/matching/profileSpecificGate.js
          node --check backend/tests/profileSpecificGateStructuredEligibility.test.js

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run focused matching and display regressions
        run: >-
          node scripts/run-vitest-isolated.mjs run
          backend/tests/profileSpecificGateStructuredEligibility.test.js
          backend/tests/relevanceFilter.softMode.test.js
          backend/tests/profileSpecificGateSurfacing.test.js
          backend/tests/matchEngineSoftRelevanceAndMatchFunds.test.js

      - name: Run repository pre-push gates
        run: npm run check:prepush

      - name: Package only the verified source files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr1179-structured-soft-verified-files
          path: |
            backend/services/relevanceFilter.js
            backend/services/matching/profileSpecificGate.js
            backend/tests/profileSpecificGateStructuredEligibility.test.js
          if-no-files-found: error
          retention-days: 7
