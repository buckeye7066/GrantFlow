name: One-time wire Anya maintenance status

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-wire-anya-maintenance-status.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-wire-anya-maintenance-status
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.20.2
          cache: npm

      - name: Apply focused patch
        run: node .github/scripts/one-time-wire-anya-maintenance-status.mjs

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run focused behavior tests
        run: node --test tests/unit/anya-maintenance-status-tool.test.mjs

      - name: Lint changed code
        run: npx eslint backend/services/anyaMaintenanceStatus.js backend/services/anyaToolRegistry.js backend/services/anyaOrchestrator.js tests/unit/anya-maintenance-status-tool.test.mjs

      - name: Type-check
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Commit verified change and remove one-time helpers
        shell: bash
        run: |
          rm -f .github/workflows/one-time-wire-anya-maintenance-status.yml
          rm -f .github/scripts/one-time-wire-anya-maintenance-status.mjs
          git config user.name "grantflow-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(anya): expose live maintenance status in chat"
          git pull --rebase origin main
          git push origin HEAD:main
