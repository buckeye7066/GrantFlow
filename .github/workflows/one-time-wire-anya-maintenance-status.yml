name: One-time wire Anya maintenance status

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-wire-anya-maintenance-status.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-wire-anya-maintenance-status
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Apply focused Anya maintenance-status wiring
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          registry_path = Path('backend/services/anyaToolRegistry.js')
          orchestrator_path = Path('backend/services/anyaOrchestrator.js')
          handler_path = Path('backend/services/anyaMaintenanceStatus.js')
          test_path = Path('tests/unit/anya-maintenance-status-tool.test.mjs')

          registry = registry_path.read_text(encoding='utf-8')
          orchestrator = orchestrator_path.read_text(encoding='utf-8')

          import_line = "import { getAnyaMaintenanceStatus } from './anyaMaintenanceStatus.js'"
          if import_line not in registry:
              marker = "} from './applicationWorkflow.js'\n\nconst tools = new Map()"
              if marker not in registry:
                  raise SystemExit('Could not locate the final registry import marker')
              registry = registry.replace(
                  marker,
                  "} from './applicationWorkflow.js'\n" + import_line + "\n\nconst tools = new Map()",
                  1,
              )

          tool_block = """registerTool({
            name: 'app.getMaintenanceStatus',
            description: 'Read the current live GrantFlow maintenance state. Use this whenever a user asks whether the maintenance banner is on or off, whether GrantFlow is in maintenance, or when it will reopen.',
            schema: {
              type: 'object',
              properties: {},
              additionalProperties: false,
            },
            handler: getAnyaMaintenanceStatus,
          })"""
          if "name: 'app.getMaintenanceStatus'" not in registry:
              marker = "\nexport function listToolMetadata(ctx = null) {"
              if marker not in registry:
                  raise SystemExit('Could not locate listToolMetadata insertion point')
              registry = registry.replace(marker, "\n" + tool_block + "\n" + marker, 1)

          docs_line = "  ['app.getMaintenanceStatus', 'Read the live maintenance state and report whether the banner is on or off. Use whenever asked about maintenance, the banner, downtime, or reopening.'],"
          if docs_line not in orchestrator:
              marker = "  ['app.explainField', 'Explain what a specific profile field does, why it matters for matching, and whether it affects crawlers (field key e.g. zip, state, health_conditions).'],"
              if marker not in orchestrator:
                  raise SystemExit('Could not locate chat tool docs insertion point')
              orchestrator = orchestrator.replace(marker, marker + "\n" + docs_line, 1)

          old_boundary = "  '- Submission details, letters of medical necessity, medical profile review, pipeline medical scans, codebase search, cross-session memory, and system-health checks run through GrantFlow\\'s app panels, not this chat. If the user needs one, explain it and point them to the exact screen — do NOT claim you executed it.',"
          new_boundary = "  '- Submission details, letters of medical necessity, medical profile review, pipeline medical scans, codebase search, cross-session memory, and broad system-health checks run through GrantFlow\\'s app panels, not this chat. The live maintenance state is the exception: call app.getMaintenanceStatus and report the result. For everything else, point the user to the exact screen — do NOT claim you executed it.',"
          if new_boundary not in orchestrator:
              if old_boundary not in orchestrator:
                  raise SystemExit('Could not locate the chat system-health boundary')
              orchestrator = orchestrator.replace(old_boundary, new_boundary, 1)

          maintenance_rule = "  '- When asked whether the maintenance banner is on or off, whether GrantFlow is in maintenance, or when it will reopen, call app.getMaintenanceStatus. Never send the user to Admin Tools for this public live status.',"
          if maintenance_rule not in orchestrator:
              lines = orchestrator.splitlines()
              inserted = False
              output = []
              for line in lines:
                  output.append(line)
                  if "If you are about to ask the user for an identifier or a click" in line:
                      output.append(maintenance_rule)
                      inserted = True
              if not inserted:
                  raise SystemExit('Could not locate the answer-routing instruction')
              orchestrator = '\n'.join(output) + ('\n' if orchestrator.endswith('\n') else '')

          progress_line = "          'app.getMaintenanceStatus': 'Checking the live maintenance status',"
          if progress_line not in orchestrator:
              marker = "          'app.explainField': 'Looking up what this field does',"
              if marker not in orchestrator:
                  raise SystemExit('Could not locate tool progress-label insertion point')
              orchestrator = orchestrator.replace(marker, marker + "\n" + progress_line, 1)

          handler_path.write_text("""import { getMaintenanceStatus } from './maintenance/maintenanceMode.js'

/**
 * Read-only tool used by Anya chat to answer live maintenance/banner questions.
 * The underlying state is the same database-backed source polled by the UI.
 */
export async function getAnyaMaintenanceStatus(_params = {}, context = {}) {
  if (!context?.db) throw new Error('Database connection unavailable')

  const status = await getMaintenanceStatus(context.db)
  const phase = status?.phase || 'open'
  const bannerVisible = phase !== 'open'
  const estimatedEnd = status?.estimated_end_at || null

  return {
    ...status,
    phase,
    active: Boolean(status?.active),
    banner_visible: bannerVisible,
    banner_state: bannerVisible ? 'on' : 'off',
    checked_at: new Date().toISOString(),
    answer: bannerVisible
      ? `The maintenance banner is on. GrantFlow is in ${phase} maintenance${estimatedEnd ? ` and is estimated to reopen at ${estimatedEnd}` : ''}.`
      : 'The maintenance banner is off. GrantFlow is open.',
  }
}
""", encoding='utf-8')

          test_path.write_text("""import test from 'node:test'
import assert from 'node:assert/strict'
import { readFile } from 'node:fs/promises'

import { getAnyaMaintenanceStatus } from '../../backend/services/anyaMaintenanceStatus.js'
import { listToolMetadata } from '../../backend/services/anyaToolRegistry.js'
import { CHAT_CALLABLE_TOOL_DOCS, CHAT_TOOL_WHITELIST } from '../../backend/services/anyaOrchestrator.js'

function makeMaintenanceDb(state) {
  return {
    prepare(sql) {
      const normalized = String(sql).replace(/\\s+/g, ' ').trim()
      if (normalized.startsWith('CREATE TABLE IF NOT EXISTS system_kv')) {
        return { run: async () => ({ changes: 0 }) }
      }
      if (normalized.startsWith('SELECT value FROM system_kv')) {
        return {
          get: async () => (state ? { value: JSON.stringify(state) } : undefined),
        }
      }
      throw new Error(`Unexpected SQL in maintenance test: ${normalized}`)
    },
  }
}

test('Anya chat advertises the live maintenance-status tool', async () => {
  const metadata = listToolMetadata()
  const tool = metadata.find((entry) => entry.name === 'app.getMaintenanceStatus')
  assert.ok(tool, 'maintenance-status tool must be registered')
  assert.equal(tool.requiresAdmin, false)
  assert.ok(CHAT_TOOL_WHITELIST.includes('app.getMaintenanceStatus'))
  assert.match(
    CHAT_CALLABLE_TOOL_DOCS.find(([name]) => name === 'app.getMaintenanceStatus')?.[1] || '',
    /banner is on or off/i,
  )

  const source = await readFile('backend/services/anyaOrchestrator.js', 'utf8')
  assert.match(source, /Never send the user to Admin Tools for this public live status/)
})

test('Anya reports the maintenance banner off when GrantFlow is open', async () => {
  const result = await getAnyaMaintenanceStatus({}, { db: makeMaintenanceDb(null) })
  assert.equal(result.phase, 'open')
  assert.equal(result.active, false)
  assert.equal(result.banner_visible, false)
  assert.equal(result.banner_state, 'off')
  assert.match(result.answer, /banner is off/i)
})

test('Anya reports the maintenance banner on for an active warning window', async () => {
  const now = Date.now()
  const result = await getAnyaMaintenanceStatus({}, {
    db: makeMaintenanceDb({
      active: true,
      reason: 'deploy',
      message: 'Finishing an update.',
      started_at: new Date(now - 60_000).toISOString(),
      grace_until: new Date(now + 10 * 60_000).toISOString(),
      estimated_end_at: new Date(now + 25 * 60_000).toISOString(),
      scheduled_by: 'test',
    }),
  })

  assert.equal(result.phase, 'warning')
  assert.equal(result.active, true)
  assert.equal(result.banner_visible, true)
  assert.equal(result.banner_state, 'on')
  assert.match(result.answer, /banner is on/i)
})
""", encoding='utf-8')

          registry_path.write_text(registry, encoding='utf-8')
          orchestrator_path.write_text(orchestrator, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run focused behavior tests
        run: node --test tests/unit/anya-maintenance-status-tool.test.mjs

      - name: Lint changed code
        run: npx eslint backend/services/anyaMaintenanceStatus.js backend/services/anyaToolRegistry.js backend/services/anyaOrchestrator.js tests/unit/anya-maintenance-status-tool.test.mjs

      - name: Type-check
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Commit verified change and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-wire-anya-maintenance-status.yml
          git config user.name "grantflow-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes remain to commit."
            exit 0
          fi
          git commit -m "feat(anya): expose live maintenance status in chat"
          git pull --rebase origin main
          git push origin HEAD:main
