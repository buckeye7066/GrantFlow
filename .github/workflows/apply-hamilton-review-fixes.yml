name: Apply Hamilton PR 1476 review fixes

on:
  push:
    branches:
      - fix/hamilton-live-task-truth-1475
    paths:
      - scripts/apply-hamilton-review-fixes.py
      - .github/workflows/apply-hamilton-review-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-hamilton-pr-1476-review-fixes
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/hamilton-live-task-truth-1475
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Apply asserted review fixes
        run: |
          python3 scripts/apply-hamilton-review-fixes.py
          rm -f scripts/apply-hamilton-review-fixes.py
          rm -f .github/workflows/apply-hamilton-review-fixes.yml

      - name: Validate changed source syntax and final diff
        run: |
          node --check backend/services/hamilton/hamiltonFundingSourcePolicy.js
          node --check backend/services/pipelineStrictReconciliation.js
          node --check backend/startup/enforceInvariants.js
          node --check backend/routes/hamiltonAutomation.js
          node --check backend/server.js
          node --check backend/tests/pipelineStrictReconciliation.test.js
          node --check backend/tests/readySourcesApplyableStarvation.test.js
          node --check tests/unit/hamilton-positive-proof-source.test.mjs
          git diff --check
          test ! -e scripts/apply-hamilton-review-fixes.py
          test ! -e .github/workflows/apply-hamilton-review-fixes.yml

      - name: Install locked dependencies
        run: npm ci --include=optional

      - name: Run focused Hamilton regression tests
        run: |
          node scripts/run-vitest-isolated.mjs run --no-file-parallelism \
            backend/tests/pipelineStrictReconciliation.test.js \
            backend/tests/readySourcesApplyableStarvation.test.js \
            backend/tests/enforceInvariants.test.js
          node --test tests/unit/hamilton-positive-proof-source.test.mjs

      - name: Run lint, typecheck, and production build
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Run full release gates
        run: npm run release:gates

      - name: Commit only validated fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "fix(hamilton): harden task-truth reconciliation"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:fix/hamilton-live-task-truth-1475
