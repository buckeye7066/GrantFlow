name: Anya report repair validation
on:
  push:
    branches: [fix/anya-report-2026-09-06]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 95cf5ee0aae646ba6ef15891dfcadcbbd00cdd91
          persist-credentials: false
      - name: Capture exact repair source
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/GrantFlow-pr1579.tar.gz" HEAD
      - name: Extract failed-test evidence from existing CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/buckeye7066/GrantFlow/actions/jobs/101517948691/logs > "$RUNNER_TEMP/backend-ci.log"
          python3 - <<'PY'
          import os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          lines = (root / 'backend-ci.log').read_text(errors='replace').splitlines()
          indices = [i for i, line in enumerate(lines) if re.search(r'\bnot ok\b|AssertionError|ERR_ASSERTION', line)]
          selected = set()
          for i in indices:
              selected.update(range(max(0, i - 8), min(len(lines), i + 38)))
          excerpt = '\n'.join(f'{i+1}: {lines[i]}' for i in sorted(selected))
          if not excerpt:
              excerpt = 'No TAP assertion located.\n' + '\n'.join(lines[-100:])
          (root / 'failure-evidence.txt').write_text(excerpt)
          print(excerpt[:50000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: anya-repair-evidence
          path: |
            ${{ runner.temp }}/failure-evidence.txt
            ${{ runner.temp }}/GrantFlow-pr1579.tar.gz
          retention-days: 1
