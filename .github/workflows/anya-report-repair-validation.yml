name: Anya report repair validation
on:
  push:
    branches: [fix/anya-report-2026-09-06]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture report-scoped public sources for the repair workspace
        run: |
          mkdir -p "$RUNNER_TEMP/report-sources/GrantFlow"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/report-sources/GrantFlow"
          for repo in incognito livehealth genemap-discovery kidney-antigen-discovery app-store-publisher local-ai-factory sermonsmith mind-over-math are-we-mice-or-are-we-men family-stewardship-navigator; do
            git clone --depth=1 "https://github.com/buckeye7066/$repo.git" "$RUNNER_TEMP/report-sources/$repo"
            git -C "$RUNNER_TEMP/report-sources/$repo" rev-parse HEAD > "$RUNNER_TEMP/report-sources/$repo/REPAIR_BASE_SHA"
            rm -rf "$RUNNER_TEMP/report-sources/$repo/.git"
          done
          tar -czf "$RUNNER_TEMP/portfolio-source.tar.gz" -C "$RUNNER_TEMP/report-sources" .
      - uses: actions/upload-artifact@v4
        with:
          name: anya-repair-source
          path: ${{ runner.temp }}/portfolio-source.tar.gz
          retention-days: 1
      - name: EVA runner regression suite
        working-directory: tools/eva-edge-runner
        run: npm test
