name: Apply bounded stale-refresh diagnostics repair

on:
  push:
    branches:
      - fix/stale-refresh-backlog-receipt
    paths:
      - scripts/apply-stale-refresh-diagnostics.mjs
      - .github/workflows/apply-stale-refresh-diagnostics.yml

permissions:
  contents: write

concurrency:
  group: apply-stale-refresh-diagnostics
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'buckeye7066/GrantFlow'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the exact repair commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=optional
      - name: Complete the regression fixtures
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const assert = require('node:assert/strict')
          const file = 'scripts/apply-stale-refresh-diagnostics.mjs'
          let script = fs.readFileSync(file, 'utf8')
          const hook = 'beforeEach(() => refresh.mockReset())'
          assert.equal(script.split(hook).length, 2)
          // Returning the mock makes Vitest treat it as a teardown callback.
          script = script.replace(hook, 'beforeEach(() => { refresh.mockReset() })')
          const green = "run(['scripts/run-vitest-isolated.mjs', 'run', paths.receiptTests,\n"
          assert.equal(script.split(green).length, 2)
          script = script.replace(green, "const runnerTestPath = 'backend/tests/enforceInvariants.test.js'\nlet runnerTest = read(runnerTestPath)\nassert.equal(hash(runnerTest), '0e99c534aa5cec00f113926d310c2eb44ff952c0')\nrunnerTest = exact(runnerTest, \"  it('runs every invariant, never throws, and returns a structured summary', async () => {\\n    const db = makeDb()\\n\", \"  it('runs every invariant, never throws, and returns a structured summary', async () => {\\n    const db = makeDb()\\n    // A healthy receipt requires a readable empty match/catalog scope. The\\n    // old fixture omitted it and relied on the wrapper hiding query failure.\\n    db.exec(`\\n      CREATE TABLE funding_opportunities (id TEXT PRIMARY KEY, title TEXT, is_active INTEGER);\\n      CREATE TABLE profile_opportunity_matches (\\n        id TEXT PRIMARY KEY, profile_id TEXT, opportunity_id TEXT,\\n        matcher_version TEXT, match_decision TEXT, match_score INTEGER,\\n        match_explain_json TEXT, match_explanation TEXT, updated_at TEXT, evaluated_at TEXT\\n      );\\n    `)\\n\")\nfs.writeFileSync(runnerTestPath, runnerTest)\n" + green)
          fs.writeFileSync(file, script)
          NODE
      - name: Reproduce failures and apply exact corrections
        run: node scripts/apply-stale-refresh-diagnostics.mjs
      - name: Verify source and diagnostic contracts
        run: |
          npm run lint
          npm run typecheck
          node scripts/pin-signal-version.mjs --check
          git diff --check
      - name: Publish only the verified source and tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='fix/stale-refresh-backlog-receipt'
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq .object.sha)"
          test "$current" = "$GITHUB_SHA"
          git add backend/services/matching/staleMatchExplainRefresh.js \
            backend/startup/enforceInvariants.js \
            tests/unit/stale-match-refresh-budget.test.mjs \
            backend/tests/staleRefreshInvariantReceipt.test.js \
            backend/tests/enforceInvariants.test.js
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'fix(matching): verify exact backlog and retain durable diagnostics'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${branch}"
          git rev-parse HEAD
