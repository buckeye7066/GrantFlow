name: Materialize link post-merge safety

on:
  push:
    branches:
      - fix/link-backlog-postmerge-safety-20260730
    paths:
      - .github/workflows/materialize-link-postmerge-safety.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: fix/link-backlog-postmerge-safety-20260730
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and materialize
        run: |
          npm ci --include=dev --include=optional
          node scripts/materialize-production-source.mjs

      - name: Commit exact materialized product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "grantflow-materializer[bot]"
          git config user.email "grantflow-materializer[bot]@users.noreply.github.com"
          git add \
            backend/services/linkBacklogRepairService.js \
            backend/routes/linkBacklogRepair.js \
            backend/tests/linkBacklogRepairService.test.js \
            backend/tests/linkBacklogSafetyRegression.test.js
          if git diff --cached --quiet; then
            echo "Materialized product source is already committed."
            exit 0
          fi
          git commit -m "fix(links): commit final materialized rescue and lock safety"
          git push origin HEAD:fix/link-backlog-postmerge-safety-20260730
