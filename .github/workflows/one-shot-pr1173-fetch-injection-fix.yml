name: One-shot PR 1173 fetch injection fix

on:
  push:
    branches:
      - fix/ssrf-egress-chokepoint-payment-cap-otp-csprng

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[fetch-injection-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/ssrf-egress-chokepoint-payment-cap-otp-csprng
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.20.2
          cache: npm

      - name: Apply explicit probe transport injection
        run: node scripts/one-shot-pr1173-fetch-injection-fix.mjs

      - name: Parse-check modified modules and tests
        run: |
          node --check backend/services/linkVerificationService.js
          node --check backend/services/linkBacklogRepairService.js
          node --check backend/tests/linkBacklogSafetyRegression.test.js
          node --check backend/tests/linkBacklogRepairService.test.js
          node --check backend/tests/linkVerificationQuarantine.test.js

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run link lifecycle and egress regressions
        run: >-
          node scripts/run-vitest-isolated.mjs run
          backend/tests/safeFetchSsrf.test.js
          backend/tests/linkBacklogSafetyRegression.test.js
          backend/tests/linkBacklogRepairService.test.js
          backend/tests/linkVerificationQuarantine.test.js
          backend/tests/paymentAuthorizationCap.test.js

      - name: Run repository pre-push gates
        run: npm run check:prepush

      - name: Commit verified fix and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/one-shot-pr1173-fetch-injection-fix.mjs
          git rm .github/workflows/one-shot-pr1173-fetch-injection-fix.yml
          git add \
            backend/services/linkVerificationService.js \
            backend/services/linkBacklogRepairService.js \
            backend/tests/linkBacklogSafetyRegression.test.js \
            backend/tests/linkBacklogRepairService.test.js \
            backend/tests/linkVerificationQuarantine.test.js
          GIT_AUTHOR_NAME="GrantFlow Security Repair" \
          GIT_AUTHOR_EMAIL="actions@users.noreply.github.com" \
          GIT_COMMITTER_NAME="GrantFlow Security Repair" \
          GIT_COMMITTER_EMAIL="actions@users.noreply.github.com" \
            git commit -m "fix(security): preserve explicit probe transport seam [fetch-injection-complete]"
          git push origin HEAD:fix/ssrf-egress-chokepoint-payment-cap-otp-csprng
