name: No reviewer-authentication release gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    name: Block mandatory reviewer release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Scan tracked text
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          policy_file = ".github/workflows/no-reviewer-release-gates.yml"
          patterns = [
              re.compile(r"\bauthenticated\s+(?:release[- ]?)?reviewers?\b", re.I),
              re.compile(r"\b(?:independent|external)\s+(?:release[- ]?)?reviewers?\s+(?:are\s+)?required\b", re.I),
              re.compile(r"\bmandatory\s+(?:independent|external)\s+review\b", re.I),
              re.compile(r"\b(?:five|5)\s+(?:distinct\s+)?(?:authenticated\s+)?(?:exact-head\s+)?reviewers?\b", re.I),
              re.compile(r"\b(?:five|5)\s+(?:exact-head\s+)?(?:independent\s+)?approvals?\b", re.I),
              re.compile(r"\brequired[_ -]reviewers?\b", re.I),
              re.compile(r"\breviewer[- ]authenticated\b", re.I),
          ]

          violations = []
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          for raw in tracked:
              if not raw:
                  continue
              name = raw.decode("utf-8", "surrogateescape")
              if name == policy_file:
                  continue
              path = pathlib.Path(name)
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              if b"\0" in data:
                  continue
              text = data.decode("utf-8", "ignore")
              for number, line in enumerate(text.splitlines(), 1):
                  if any(pattern.search(line) for pattern in patterns):
                      violations.append(f"{name}:{number}: {line.strip()}")

          if violations:
              print("Mandatory reviewer-authentication release language is prohibited:")
              print("\n".join(violations))
              sys.exit(1)
          print("No mandatory reviewer-authentication release gates found.")
          PY
