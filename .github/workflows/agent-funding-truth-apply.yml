name: Apply funding-truth pipeline

on:
  push:
    branches:
      - agent/funding-truth-pipeline

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm

      - name: Apply deterministic funding-truth patches
        run: node scripts/agent/apply-funding-truth-pipeline.mjs

      - name: Restore temporary driver for tracked-file scanners
        run: |
          git checkout -- \
            scripts/agent/apply-funding-truth-pipeline.mjs \
            .github/workflows/agent-funding-truth-apply.yml

      - name: Install locked dependencies
        run: npm ci --include=optional

      - name: Focused truth-pipeline tests
        run: |
          npx vitest run \
            backend/tests/webGrantExtractor.test.js \
            backend/tests/blindExtractorNotWired.test.js \
            backend/tests/resultEnricherStoredDecisionDefault.test.js \
            backend/tests/fundingSourcesReadOnly.test.js \
            src/components/funding/FundingResultCard.test.jsx \
            src/lib/__tests__/matchDisplayThresholds.test.js
          node --test \
            backend/crawler-os/tests/officialDirectoryAdapterTruth.test.mjs \
            backend/crawler-os/tests/blindPageFactExtractor.test.mjs \
            backend/crawler-os/tests/pageFactProvenance.test.mjs

      - name: Repository pre-push gates
        run: npm run check:prepush

      - name: Commit verified implementation
        run: |
          git config user.name "GrantFlow Truth Pipeline"
          git config user.email "actions@users.noreply.github.com"
          rm -f \
            scripts/agent/apply-funding-truth-pipeline.mjs \
            .github/workflows/agent-funding-truth-apply.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat(discovery): establish evidence-backed funding truth"
          git push origin "HEAD:${GITHUB_REF_NAME}"
