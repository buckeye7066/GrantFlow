name: production-audit-runtime-finalizer

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: production-audit-runtime-finalizer
  cancel-in-progress: false

jobs:
  apply-verified-correction:
    # One exact owner command runs one immutable same-repository commit. The
    # branch equality guard makes the workflow one-shot even if the command is
    # repeated. A dedicated PAT performs the final push so GitHub emits a normal
    # pull_request synchronize event and required checks attach to the new head.
    if: >-
      github.repository == 'buckeye7066/GrantFlow' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 1035 &&
      github.event.comment.user.login == 'buckeye7066' &&
      github.event.comment.body == '/run-runtime-finalizer-1035'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: agent/finish-runtime-finalizer-20260729
      EXPECTED_HEAD: 06c61917f4c57d1de708222ef08350b2062d8939
    steps:
      - name: Check out the immutable correction commit
        uses: actions/checkout@v7
        with:
          ref: 06c61917f4c57d1de708222ef08350b2062d8939
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse stale, repeated, or unauthenticated execution
        id: guard
        shell: bash
        env:
          FINALIZER_PAT: ${{ secrets.ANYA_PR_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if [ -z "$FINALIZER_PAT" ]; then
            echo "ANYA_PR_TOKEN is required so the verified push triggers ordinary PR checks."
            exit 1
          fi
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          if [ "$remote_head" != "$EXPECTED_HEAD" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Target branch already moved; the one-shot finalizer will not run again."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node 20
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        if: steps.guard.outputs.run == 'true'
        run: npm ci --include=optional

      - name: Apply deterministic runtime correction
        if: steps.guard.outputs.run == 'true'
        run: python scripts/production-audit-runtime-finalizer.py

      - name: Run focused regressions
        if: steps.guard.outputs.run == 'true'
        run: |
          node --test tests/unit/anya-chat-hook-order.test.mjs
          npm exec -- vitest run backend/tests/portalCheckLegacyHonesty.test.js backend/tests/portalCheckService.test.js --reporter=verbose

      - name: Run pre-push quality gates
        if: steps.guard.outputs.run == 'true'
        run: npm run check:prepush

      - name: Run secret scan
        if: steps.guard.outputs.run == 'true'
        run: npm run scan:secrets

      - name: Run complete release gates
        if: steps.guard.outputs.run == 'true'
        run: npm run release:gates

      - name: Remove scaffolding, commit, and push through the PR token
        if: steps.guard.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ANYA_PR_TOKEN }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-runtime-finalizer-branch.yml
          rm -f .github/workflows/production-audit-runtime-finalizer.yml
          rm -f scripts/production-audit-runtime-finalizer.py
          git diff --check
          git config user.name "grantflow-audit-finalizer[bot]"
          git config user.email "grantflow-audit-finalizer[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(audit): close Dashboard hook crash and legacy portal claims"
          gh auth setup-git
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD" origin "HEAD:refs/heads/$TARGET_BRANCH"
