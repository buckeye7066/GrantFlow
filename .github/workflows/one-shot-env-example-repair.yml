name: One-shot env example repair

on:
  push:
    branches:
      - fix/vercel-env-example-drift-20260807

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[env-example-repair-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/vercel-env-example-drift-20260807
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.20.2

      - name: Regenerate and verify environment examples
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-env-examples.mjs

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(.env.example backend/.env.example)
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected generated file set: %s\n' "${changed[*]}" >&2
            exit 1
          fi

          node scripts/check-env-examples.mjs

      - name: Commit generated contract and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GrantFlow Release Repair"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-shot-env-example-repair.yml
          git add .env.example backend/.env.example
          git commit -m "fix(release): regenerate env examples [env-example-repair-complete]"
          git push origin HEAD:fix/vercel-env-example-drift-20260807
