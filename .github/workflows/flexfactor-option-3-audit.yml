name: FlexFactor option 3 audit

on:
  pull_request:
    paths:
      - '.github/workflows/flexfactor-option-3-audit.yml'

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: flexfactor-option-3-grantflow-main
  cancel-in-progress: true

jobs:
  audit:
    name: Run FlexFactor option 3 to completion
    runs-on: ubuntu-latest
    timeout-minutes: 360

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grantflow_flexfactor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: 'true'
      NODE_ENV: development
      SMOKE_MODE: 'true'
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/grantflow_flexfactor
      DB_PROVIDER: postgres
      DB_DIALECT: postgres
      MIGRATE_ON_BOOT: 'false'
      DB_AUTO_MIGRATE: 'false'
      ALLOW_EPHEMERAL_UPLOADS: 'true'
      UPLOADS_DIR: /tmp/grantflow-flexfactor-uploads
      AUTH_JWT_SECRET: grantflow-ci-flexfactor-secret-not-for-production
      ADMIN_TOKEN: grantflow-ci-flexfactor-admin-token
      RUNTIME_SECRETS_KEY: '5555555555555555555555555555555555555555555555555555555555555555'
      FLEXFACTOR_PURPOSE_SAMPLES: '3'

    steps:
      - name: Check out temporary audit harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: harness
          persist-credentials: false

      - name: Check out exact GrantFlow main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: buckeye7066/GrantFlow
          ref: 1c648dd803004ee179c2b9116fd42ae4f42309c8
          path: GrantFlow
          fetch-depth: 0
          persist-credentials: true

      - name: Pin writable working branch to the audited main commit
        working-directory: GrantFlow
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "1c648dd803004ee179c2b9116fd42ae4f42309c8" || {
            echo "::error::GrantFlow main advanced after the harness was pinned; refusing to audit stale code"
            exit 75
          }
          git switch -C main "1c648dd803004ee179c2b9116fd42ae4f42309c8"
          git branch --set-upstream-to=origin/main main
          test "$(git rev-parse HEAD)" = "1c648dd803004ee179c2b9116fd42ae4f42309c8"

      - name: Restore the latest compatible FlexFactor checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          resume_dir="$RUNNER_TEMP/flexfactor-resume"
          gh run download 31977620982 \
            --repo buckeye7066/GrantFlow \
            --name flexfactor-option-3-v037-grantflow-1c648d \
            --dir "$resume_dir"
          checkpoint="$resume_dir/checkpoint.json"
          test -f "$checkpoint" || {
            echo "::error::The prior compatible FlexFactor checkpoint was not found"
            exit 1
          }
          CHECKPOINT="$checkpoint" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["CHECKPOINT"])
          data = json.loads(path.read_text(encoding="utf-8"))
          data["status"] = "interrupted"
          data["pid"] = 0
          data.pop("finished_at", None)
          destination = (Path.home() / ".flexfactor" / "runs" /
                         str(data["run_id"]) / "checkpoint.json")
          destination.parent.mkdir(parents=True, exist_ok=True)
          destination.write_text(json.dumps(data), encoding="utf-8")
          print(f"Restored {len(data.get('reviewed') or {})} SHA-verified reviews from {data.get('run_id')}")
          PY
          test -z "$(git -C GrantFlow status --porcelain)" || {
            echo "::error::Checkpoint restore altered GrantFlow; only FlexFactor may author target fixes"
            git -C GrantFlow status --short
            exit 1
          }

      - name: Restore and verify exact FlexFactor v0.3.8 runtime
        run: |
          base64 --decode harness/.github/flexfactor-runtime-45dd3e741.zip.b64 > flexfactor-runtime.zip
          echo "b937f23aa3430d3fe221774c50ee8580594e24efb782e561d394ba4d950ce2d0  flexfactor-runtime.zip" | sha256sum --check
          mkdir flexfactor
          unzip -q flexfactor-runtime.zip -d flexfactor
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "flexfactor")
          import flexfactor
          assert flexfactor.TOOL_VERSION == "0.3.8", flexfactor.TOOL_VERSION
          PY
          python3 flexfactor/flexfactor.py audit --help | grep -F -- '--single-provider-review-workers'
          python3 -m py_compile flexfactor/flexfactor.py flexfactor/flexfactor_*.py
          python3 -m pip install --disable-pip-version-check -r flexfactor/requirements.txt

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: GrantFlow/package-lock.json

      - name: Verify runtime and rotated OpenAI credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node --version
          npm --version
          python3 --version
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not configured for this repository"
            exit 78
          fi

      - name: Install exact GrantFlow dependencies
        working-directory: GrantFlow
        run: npm ci --include=optional

      - name: Prepare disposable integration database and browser
        working-directory: GrantFlow
        run: |
          mkdir -p "$UPLOADS_DIR"
          npm run migrate
          node backend/scripts/verify-pg-schema.mjs
          node ./node_modules/playwright/cli.js install chromium --with-deps

      - name: Run FlexFactor option 3
        id: flexfactor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: |
          git -C GrantFlow config user.name "FlexFactor CI"
          git -C GrantFlow config user.email "flexfactor-ci@localhost"
          set +e
          set -o pipefail
          timeout --signal=TERM --kill-after=2m 330m python3 flexfactor/flexfactor.py audit \
            --program "$GITHUB_WORKSPACE/GrantFlow" \
            --model-mode paid \
            --provider openai \
            --single \
            --economy \
            --review-workers 8 \
            --single-provider-review-workers 8 \
            --review-fix-batch-size 512 \
            --yes \
            --redact \
            --allow-dirty \
            --no-dashboard \
            --push \
            --merge 2>&1 | tee flexfactor-option-3.log
          code=${PIPESTATUS[0]}
          echo "$code" > flexfactor-exit-code.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture complete, sanitized audit evidence
        if: always()
        run: |
          mkdir -p flexfactor-output
          cp flexfactor-option-3.log flexfactor-output/ 2>/dev/null || true
          cp flexfactor-exit-code.txt flexfactor-output/ 2>/dev/null || true
          git -C GrantFlow status --short --branch > flexfactor-output/git-status.txt
          git -C GrantFlow log --oneline --decorate --max-count=100 > flexfactor-output/git-log.txt
          git -C GrantFlow remote -v > flexfactor-output/git-remotes.txt
          git -C GrantFlow diff --stat "1c648dd803004ee179c2b9116fd42ae4f42309c8" HEAD > flexfactor-output/audit-diff-stat.txt
          git -C GrantFlow diff --binary "1c648dd803004ee179c2b9116fd42ae4f42309c8" HEAD > flexfactor-output/audit-commits.patch
          git -C GrantFlow diff --binary > flexfactor-output/audit-working-tree.patch
          git -C GrantFlow diff --binary --cached > flexfactor-output/audit-index.patch
          git -C GrantFlow ls-files --others --exclude-standard > flexfactor-output/audit-untracked-files.txt
          git -C GrantFlow rev-parse HEAD > flexfactor-output/local-head.txt
          git -C GrantFlow ls-remote origin refs/heads/main > flexfactor-output/remote-main.txt
          find GrantFlow -maxdepth 3 -type f \( -name '*flexfactor*report*' -o -name 'AUDIT_REPORT.md' \) -exec cp {} flexfactor-output/ \; 2>/dev/null || true
          CHECKPOINT="$(find "$HOME/.flexfactor/runs" -name checkpoint.json -type f -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2-)" \
            python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          source = os.environ.get("CHECKPOINT", "")
          if not source:
              raise SystemExit(0)
          sensitive = re.compile(r"(api.?key|authorization|credential|password|secret|token)", re.I)
          token = re.compile(r"(?i)(sk-[a-z0-9_-]{12,}|bearer\s+[a-z0-9._-]{12,})")

          def clean(value, key=""):
              if sensitive.search(key):
                  return "[REDACTED]"
              if isinstance(value, dict):
                  return {k: clean(v, str(k)) for k, v in value.items()}
              if isinstance(value, list):
                  return [clean(v) for v in value]
              if isinstance(value, str):
                  return token.sub("[REDACTED]", value)
              return value

          data = clean(json.loads(Path(source).read_text(encoding="utf-8")))
          Path("flexfactor-output/checkpoint.json").write_text(
              json.dumps(data, indent=2, sort_keys=True), encoding="utf-8")
          for path in Path("flexfactor-output").iterdir():
              if path.is_file():
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  path.write_text(token.sub("[REDACTED]", text), encoding="utf-8")
          PY
          if grep -RIEq '(sk-[A-Za-z0-9_-]{12,}|Bearer[[:space:]]+[A-Za-z0-9._-]{12,})' flexfactor-output; then
            echo "::error::Potential credential material found in the evidence bundle"
            exit 1
          fi

      - name: Upload complete audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flexfactor-option-3-v038-grantflow-1c648d
          path: flexfactor-output
          if-no-files-found: error
          retention-days: 14

      - name: Enforce FlexFactor result and publication
        if: always()
        working-directory: GrantFlow
        run: |
          test -f ../flexfactor-exit-code.txt || {
            echo "::error::FlexFactor did not produce an exit code"
            exit 1
          }
          code="$(tr -d '[:space:]' < ../flexfactor-exit-code.txt)"
          if [ "$code" != "0" ]; then
            echo "::error::FlexFactor option 3 failed with exit code $code; inspect the uploaded evidence"
            exit "$code"
          fi
          local_head="$(git rev-parse HEAD)"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$local_head" != "$remote_main" ]; then
            echo "::error::FlexFactor exited successfully but did not reconcile its verified result to GrantFlow main (local=$local_head remote=$remote_main)"
            exit 1
          fi
          test -z "$(git status --porcelain)" || {
            echo "::error::FlexFactor exited successfully with an unclean working tree"
            git status --short
            exit 1
          }
          echo "FlexFactor option 3 completed successfully and reconciled its exact result to main"
