name: FlexFactor option 3 audit

on:
  pull_request:
    paths:
      - '.github/workflows/flexfactor-option-3-audit.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: flexfactor-option-3-grantflow-1c648d
  cancel-in-progress: false

jobs:
  audit:
    name: Run FlexFactor option 3 to completion
    runs-on: ubuntu-latest
    timeout-minutes: 360

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grantflow_flexfactor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: 'true'
      NODE_ENV: development
      SMOKE_MODE: 'true'
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/grantflow_flexfactor
      DB_PROVIDER: postgres
      DB_DIALECT: postgres
      MIGRATE_ON_BOOT: 'false'
      DB_AUTO_MIGRATE: 'false'
      ALLOW_EPHEMERAL_UPLOADS: 'true'
      UPLOADS_DIR: /tmp/grantflow-flexfactor-uploads
      AUTH_JWT_SECRET: grantflow-ci-flexfactor-secret-not-for-production
      ADMIN_TOKEN: grantflow-ci-flexfactor-admin-token
      RUNTIME_SECRETS_KEY: '5555555555555555555555555555555555555555555555555555555555555555'

    steps:
      - name: Check out temporary audit harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: harness
          persist-credentials: false

      - name: Check out exact GrantFlow main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: buckeye7066/GrantFlow
          ref: 1c648dd803004ee179c2b9116fd42ae4f42309c8
          path: GrantFlow
          fetch-depth: 0
          persist-credentials: true

      - name: Pin writable working branch to the audited main commit
        working-directory: GrantFlow
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "1c648dd803004ee179c2b9116fd42ae4f42309c8" || {
            echo "::error::GrantFlow main advanced after the harness was pinned; refusing to audit stale code"
            exit 75
          }
          git switch -C main "1c648dd803004ee179c2b9116fd42ae4f42309c8"
          git branch --set-upstream-to=origin/main main
          test "$(git rev-parse HEAD)" = "1c648dd803004ee179c2b9116fd42ae4f42309c8"

      - name: Restore and verify released FlexFactor runtime
        run: |
          base64 --decode harness/.github/flexfactor-runtime-9724c994.zip.b64 > flexfactor-runtime.zip
          echo "b5e55c628839e50d66587abb3bf62b3b5bf31282f24d204ec182c453893f8ba5  flexfactor-runtime.zip" | sha256sum --check
          mkdir flexfactor
          unzip -q flexfactor-runtime.zip -d flexfactor
          python3 -m py_compile flexfactor/flexfactor.py flexfactor/flexfactor_*.py
          python3 -m pip install --disable-pip-version-check -r flexfactor/requirements.txt

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: GrantFlow/package-lock.json

      - name: Verify runtime and model credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node --version
          npm --version
          python3 --version
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Neither ANTHROPIC_API_KEY nor OPENAI_API_KEY is configured for this repository"
            exit 78
          fi

      - name: Install exact GrantFlow dependencies
        working-directory: GrantFlow
        run: npm ci --include=optional

      - name: Prepare disposable integration database and browser
        working-directory: GrantFlow
        run: |
          mkdir -p "$UPLOADS_DIR"
          npm run migrate
          node backend/scripts/verify-pg-schema.mjs
          node ./node_modules/playwright/cli.js install chromium --with-deps

      - name: Run FlexFactor option 3
        id: flexfactor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: |
          git -C GrantFlow config user.name "FlexFactor CI"
          git -C GrantFlow config user.email "flexfactor-ci@localhost"
          set +e
          set -o pipefail
          timeout --signal=TERM --kill-after=2m 330m python3 flexfactor/flexfactor.py audit \
            --program "$GITHUB_WORKSPACE/GrantFlow" \
            --model-mode paid \
            --economy \
            --yes \
            --redact \
            --no-dashboard \
            --push \
            --merge 2>&1 | tee flexfactor-option-3.log
          code=${PIPESTATUS[0]}
          echo "$code" > flexfactor-exit-code.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture complete audit evidence
        if: always()
        run: |
          mkdir -p flexfactor-output
          cp flexfactor-option-3.log flexfactor-output/ 2>/dev/null || true
          cp flexfactor-exit-code.txt flexfactor-output/ 2>/dev/null || true
          cp -R "$HOME/.flexfactor" flexfactor-output/state 2>/dev/null || true
          git -C GrantFlow status --short --branch > flexfactor-output/git-status.txt
          git -C GrantFlow log --oneline --decorate --max-count=100 > flexfactor-output/git-log.txt
          git -C GrantFlow remote -v > flexfactor-output/git-remotes.txt
          git -C GrantFlow diff --stat "1c648dd803004ee179c2b9116fd42ae4f42309c8" HEAD > flexfactor-output/audit-diff-stat.txt
          git -C GrantFlow diff --binary "1c648dd803004ee179c2b9116fd42ae4f42309c8" HEAD > flexfactor-output/audit-commits.patch
          git -C GrantFlow diff --binary > flexfactor-output/audit-working-tree.patch
          git -C GrantFlow diff --binary --cached > flexfactor-output/audit-index.patch
          git -C GrantFlow ls-files --others --exclude-standard -z | tar --null -czf flexfactor-output/audit-untracked.tar.gz -C GrantFlow -T -
          git -C GrantFlow rev-parse HEAD > flexfactor-output/local-head.txt
          git -C GrantFlow ls-remote origin refs/heads/main > flexfactor-output/remote-main.txt
          find GrantFlow -maxdepth 3 -type f \( -name '*flexfactor*report*' -o -name 'AUDIT_REPORT.md' \) -exec cp {} flexfactor-output/ \; 2>/dev/null || true

      - name: Upload complete audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flexfactor-option-3-grantflow-1c648d
          path: flexfactor-output
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Enforce FlexFactor result and publication
        if: always()
        working-directory: GrantFlow
        run: |
          test -f ../flexfactor-exit-code.txt || {
            echo "::error::FlexFactor did not produce an exit code"
            exit 1
          }
          code="$(tr -d '[:space:]' < ../flexfactor-exit-code.txt)"
          if [ "$code" != "0" ]; then
            echo "::error::FlexFactor option 3 failed with exit code $code; inspect the uploaded evidence"
            exit "$code"
          fi
          local_head="$(git rev-parse HEAD)"
          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$local_head" != "$remote_main" ]; then
            echo "::error::FlexFactor exited successfully but did not reconcile its verified result to GrantFlow main (local=$local_head remote=$remote_main)"
            exit 1
          fi
          test -z "$(git status --porcelain)" || {
            echo "::error::FlexFactor exited successfully with an unclean working tree"
            git status --short
            exit 1
          }
          echo "FlexFactor option 3 completed successfully and reconciled its exact result to main"
