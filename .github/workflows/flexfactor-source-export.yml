name: flexfactor-source-export
on:
  pull_request:
    paths:
      - .github/workflows/flexfactor-source-export.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9587154d94546bf42cce6cc46d0ec21137a5a484
          fetch-depth: 1
      - uses: actions/upload-artifact@v4
        with:
          name: grantflow-source-9587154d9454
          path: |
            .
            !.git
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
