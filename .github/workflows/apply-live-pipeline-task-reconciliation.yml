name: Apply live pipeline task reconciliation

on:
  push:
    branches:
      - fix/live-pipeline-task-reconciliation

permissions:
  contents: write

concurrency:
  group: live-pipeline-task-reconciliation
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out incident branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply exact production incident patch
        run: node scripts/apply-live-pipeline-task-reconciliation.mjs

      - name: Verify changed source parses
        run: |
          node --check backend/services/robert/robertPipelineAudit.js
          node --check backend/services/hamilton/hamiltonFundingSourcePolicy.js
          node --check backend/services/hamilton/hamiltonAutomationOrchestrator.js
          node --check backend/startup/enforceInvariants.js

      - name: Run focused regression suite
        env:
          RUNTIME_SECRETS_KEY: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
        run: |
          npx vitest run \
            backend/tests/pipelinePrecisionSweep.test.js \
            backend/tests/pipelinePrecisionTaskReconciliation.test.js \
            backend/tests/hamiltonTaskCreationGate.test.js \
            backend/tests/hamiltonSkipClosesExistingTask.test.js \
            backend/tests/applicationTaskIdentityAndPointerLeads.test.js \
            backend/tests/hamiltonTaskCreationGate.test.js

      - name: Run lint on incident surface
        run: |
          npx eslint \
            backend/services/robert/robertPipelineAudit.js \
            backend/services/hamilton/hamiltonFundingSourcePolicy.js \
            backend/services/hamilton/hamiltonAutomationOrchestrator.js \
            backend/startup/enforceInvariants.js \
            backend/tests/pipelinePrecisionSweep.test.js \
            backend/tests/pipelinePrecisionTaskReconciliation.test.js \
            backend/tests/hamiltonTaskCreationGate.test.js \
            backend/tests/hamiltonSkipClosesExistingTask.test.js

      - name: Commit verified repair
        run: |
          rm -f scripts/apply-live-pipeline-task-reconciliation.mjs
          rm -f .github/workflows/apply-live-pipeline-task-reconciliation.yml
          git config user.name "GrantFlow Incident Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(pipeline): cancel invalid Hamilton work and require four positive gates"
          git push origin HEAD:fix/live-pipeline-task-reconciliation
