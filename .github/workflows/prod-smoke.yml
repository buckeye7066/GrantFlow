name: Prod smoke (read-only)

permissions:
  contents: read

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL (e.g. https://app.axiombiolabs.org)"
        required: true
        default: "https://app.axiombiolabs.org"
      base_path:
        description: "App base path (production is served at /)"
        required: true
        default: "/"
      ready_url:
        description: "Backend /readyz URL (may be on a different origin)"
        required: true
        default: "https://grantflow-production.up.railway.app/readyz"

jobs:
  smoke:
    # Only a successful push CI for this repository's main may trigger the
    # automatic live read. Pull-request and fork runs cannot select its source.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Run read-only smoke
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url || 'https://app.axiombiolabs.org' }}
          SMOKE_BASE_PATH: ${{ inputs.base_path || '/' }}
          # /readyz is a backend release gate; the Vercel frontend proxies only
          # /api and /uploads. Keep it an explicit dispatch input so a smoke of
          # another environment cannot silently report production's readiness.
          SMOKE_READY_URL: ${{ inputs.ready_url || 'https://grantflow-production.up.railway.app/readyz' }}
        run: node scripts/smoke-prod-readonly.mjs
