name: Prod smoke (read-only)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL (e.g. https://app.axiombiolabs.org)"
        required: true
        default: "https://app.axiombiolabs.org"
      base_path:
        description: "App base path (production is served at /)"
        required: true
        default: "/"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Run read-only smoke
        env:
          SMOKE_BASE_URL: ${{ inputs.base_url }}
          SMOKE_BASE_PATH: ${{ inputs.base_path }}
        run: node scripts/smoke-prod-readonly.mjs
