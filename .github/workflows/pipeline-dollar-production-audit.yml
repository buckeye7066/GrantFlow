name: pipeline-dollar-production-audit

# Manual only. This workflow reads production financial-aid data and must never
# run as a side effect of a push or pull request.
on:
  workflow_dispatch:
    inputs:
      profile_ids:
        description: 'Optional comma-separated production profile IDs; empty audits every real active profile'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pipeline-dollar-production-audit
  cancel-in-progress: false

jobs:
  ledger:
    name: Prove and measure pipeline dollars (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-audit

    env:
      GRANTFLOW_PROD_BASE_URL: ${{ vars.GRANTFLOW_PROD_BASE_URL }}
      AUDIT_OUT: ${{ github.workspace }}/audit-out

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify redaction and ledger artifact gates offline
        run: |
          node scripts/production-audit/redact.mjs --self-test
          node scripts/production-audit/validate-pipeline-dollar-ledger.mjs --self-test
          npx vitest run backend/tests/productionPipelineDollarLedger.test.js backend/tests/pipelineDollarContract.test.js

      # Reuse the established containment gate: scoped non-superuser role,
      # default read-only session, writes refused by privilege, sensitive tables
      # denied, and auto-submit disabled in the process serving production.
      - name: Verify production database guard and auto-submit posture
        env:
          GRANTFLOW_PROD_AUDIT_DATABASE_URL: ${{ secrets.GRANTFLOW_PROD_AUDIT_DATABASE_URL }}
        run: |
          mkdir -p "$AUDIT_OUT"
          node scripts/production-audit/db-audit.mjs --guard-only --out "$AUDIT_OUT"

      # Dispatch text travels through env, never raw workflow interpolation in
      # the shell. The script parameterizes every database value.
      - name: Generate the before-and-after pipeline-dollar ledger
        env:
          GRANTFLOW_PROD_AUDIT_DATABASE_URL: ${{ secrets.GRANTFLOW_PROD_AUDIT_DATABASE_URL }}
          PROFILE_IDS: ${{ inputs.profile_ids }}
        run: |
          node scripts/production-audit/pipeline-dollar-ledger.mjs \
            --out "$AUDIT_OUT/pipeline-dollar-ledger.json" \
            --profiles "$PROFILE_IDS"

      - name: Validate ledger contract and scan every byte for secrets
        run: |
          node scripts/production-audit/validate-pipeline-dollar-ledger.mjs \
            --file "$AUDIT_OUT/pipeline-dollar-ledger.json"

      - name: Upload sanitized pipeline-dollar ledger
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grantflow-pipeline-dollar-audit-${{ github.run_id }}
          path: ${{ env.AUDIT_OUT }}/pipeline-dollar-ledger.json
          if-no-files-found: error
          retention-days: 14
