name: Apply bounded autofill repair
on:
  push:
    branches: [fix/foundation-location-submit-20260918]
    paths: [.github/workflows/foundation-autofill-patch.yml]
permissions:
  contents: read
jobs:
  apply-autofill-repair:
    if: github.repository == 'buckeye7066/GrantFlow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Patch the reproduced submission boundary only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          if Path('.agent-edit-lock').exists():
              raise SystemExit('Another editor holds the repository lock')
          path = Path('src/pages/Start.jsx')
          source = path.read_text()
          edits = [
            ("  const [zipLooking, setZipLooking] = useState(false)\n  const canSubmit = !zipLooking && /^\\d{5}(-\\d{4})?$/.test(zip.trim()) && /^[A-Z]{2}$/.test(stateCode.trim().toUpperCase())", "  const [zipLooking, setZipLooking] = useState(false)\n  const [settledZip, setSettledZip] = useState(null)\n  const zipValueRef = useRef('')\n  const lookupZip = /^\\d{5}(?:-\\d{4})?$/.test(zip.trim()) ? zip.trim().slice(0, 5) : null\n  const canSubmit = Boolean(lookupZip) && settledZip === lookupZip && !zipLooking && /^[A-Z]{2}$/.test(stateCode.trim().toUpperCase())"),
            ("    const z = zip.trim()\n    if (!/^\\d{5}$/.test(z)) {\n      setZipLooking(false)\n      return\n    }\n    let cancelled = false\n    setZipLooking(true)", "    const z = lookupZip\n    if (!z) {\n      setZipLooking(false)\n      setSettledZip(null)\n      return\n    }\n    let cancelled = false\n    setZipLooking(true)\n    setStateCode('')\n    setCity('')\n    if (!countyManuallyEdited.current) setCounty('')"),
            ("      .finally(() => { if (!cancelled) setZipLooking(false) })\n    return () => { cancelled = true }\n  }, [zip])", "      .finally(() => {\n        if (cancelled) return\n        setSettledZip(z)\n        setZipLooking(false)\n      })\n    return () => { cancelled = true }\n  }, [lookupZip])"),
            ("        if (!canSubmit || busy) return\n        onSubmit({\n          zip: zip.trim(),", "        // Autofill can submit before React commits the input change.\n        if (!canSubmit || busy || zipValueRef.current.trim() !== zip.trim()) return\n        onSubmit({\n          zip: zip.trim(),"),
            ("              onChange={(e) => setZip(e.target.value)}", "              onChange={(e) => {\n                zipValueRef.current = e.target.value\n                setZip(e.target.value)\n              }}"),
          ]
          for old, new in edits:
              if source.count(old) != 1:
                  raise SystemExit('Expected exactly one reviewed LocationQuestion source pattern')
              source = source.replace(old, new, 1)
          path.write_text(source)
          PY
          git diff --check
          git diff -- src/pages/Start.jsx
      - name: Commit only the reviewed UI source to the repair branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Start.jsx
          git commit -m 'fix(onboarding): bind submission to settled ZIP including autofill'
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:refs/heads/fix/foundation-location-submit-20260918
