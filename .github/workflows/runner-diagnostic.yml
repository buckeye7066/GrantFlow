name: Runner Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  bare-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove the hosted runner can execute a bare shell step
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_started=true"
          uname -a
          printf 'node=' && node --version
