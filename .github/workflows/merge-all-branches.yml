name: Merge All Branches to Main

on:
  # Allow manual trigger only
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no actual merges)'
        required: false
        default: true
        type: boolean
      exclude_branches:
        description: 'Comma-separated list of branch names to exclude (in addition to main)'
        required: false
        default: ''
        type: string
      batch_size:
        description: 'Number of branches to process in this run (0 = all)'
        required: false
        default: '10'
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  merge-all-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch all branches
        run: |
          git fetch --all --prune
          echo "Fetched all remote branches"

      - name: Get all branches
        id: get-branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_REF: ${{ github.ref_name }}
          INPUT_EXCLUDE_BRANCHES: ${{ inputs.exclude_branches }}
          INPUT_BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          echo "Fetching all branches from GitHub..."

          # Get all branches
          gh api repos/:owner/:repo/branches --paginate --jq ".[].name" > all_branches.txt

          # Count total branches
          TOTAL_BRANCHES=$(wc -l < all_branches.txt)
          echo "Found $TOTAL_BRANCHES total branches"

          # Default excludes
          EXCLUDE_LIST="main,$CURRENT_REF"

          # Add user-specified excludes
          if [ -n "$INPUT_EXCLUDE_BRANCHES" ]; then
            EXCLUDE_LIST="$EXCLUDE_LIST,$INPUT_EXCLUDE_BRANCHES"
          fi

          echo "Excluding: $EXCLUDE_LIST"

          # Filter out excluded branches
          > branches_to_merge.txt
          while IFS= read -r branch; do
            # Check if branch is in exclude list
            EXCLUDED=false
            IFS=',' read -ra EXCLUDES <<< "$EXCLUDE_LIST"
            for exclude in "${EXCLUDES[@]}"; do
              if [ "$branch" = "$exclude" ]; then
                EXCLUDED=true
                break
              fi
            done

            # Never auto-process bot-generated codeguard/autofix branches.
            if echo "$branch" | grep -Eiq '(^|/)(codeguard|anya-fix|autofix)(/|$)'; then
              EXCLUDED=true
            fi

            if [ "$EXCLUDED" = false ]; then
              echo "$branch" >> branches_to_merge.txt
            fi
          done < all_branches.txt

          MERGE_COUNT=$(wc -l < branches_to_merge.txt)
          echo "Branches to merge: $MERGE_COUNT"

          # Apply batch size limit if specified
          BATCH_SIZE="$INPUT_BATCH_SIZE"
          if [ "$BATCH_SIZE" != "0" ] && [ "$MERGE_COUNT" -gt "$BATCH_SIZE" ]; then
            head -n "$BATCH_SIZE" branches_to_merge.txt > branches_to_merge_batch.txt
            mv branches_to_merge_batch.txt branches_to_merge.txt
            echo "Limited to batch of $BATCH_SIZE branches"
            MERGE_COUNT=$BATCH_SIZE
          fi

          echo "branch_count=$MERGE_COUNT" >> $GITHUB_OUTPUT

          cat branches_to_merge.txt

      - name: Create PRs and merge branches
        if: fromJSON(steps.get-branches.outputs.branch_count) > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "Processing branches..."
          echo "Dry run: $DRY_RUN"
          echo ""

          CREATED_COUNT=0
          MERGED_COUNT=0
          DELETED_COUNT=0
          SKIPPED_COUNT=0
          FAILED_COUNT=0
          EXISTING_COUNT=0

          while IFS= read -r branch; do
            echo "=========================================="
            echo "Processing branch: $branch"
            echo "=========================================="

            # Check if PR already exists
            EXISTING_PR=$(gh pr list --head "$branch" --base main --json number --jq ".[0].number" 2>/dev/null || echo "")

            if [ -n "$EXISTING_PR" ]; then
              echo "ℹ️  PR already exists: #$EXISTING_PR"
              EXISTING_COUNT=$((EXISTING_COUNT + 1))

              # Try to merge existing PR
              if [ "$DRY_RUN" = "true" ]; then
                echo "🔍 [DRY RUN] Would merge existing PR #$EXISTING_PR"
              else
                # Require clean checks + at least one approval before auto-merge.
                MERGEABLE_STATE=$(gh pr view "$EXISTING_PR" --json mergeable --jq '.mergeable')
                if [ "$MERGEABLE_STATE" != "MERGEABLE" ]; then
                  echo "⏸️  PR #$EXISTING_PR not mergeable (state: $MERGEABLE_STATE). Skipping."
                  echo ""
                  continue
                fi

                # Check status via mergeStateStatus, NOT statusCheckRollup:
                # the rollup GraphQL query traverses checkSuite.workflowRun
                # nodes owned by foreign GitHub Apps (e.g. Vercel), which the
                # default GITHUB_TOKEN cannot read ("GraphQL: Resource not
                # accessible by integration"). mergeStateStatus is a plain
                # computed field and is stricter-or-equal: CLEAN means every
                # branch-protection requirement is satisfied — the required
                # "test" and "postgres-migrations" checks are PRESENT and
                # SUCCESSFUL, and nothing is failing, cancelled, or pending.
                # An empty/never-reported check rollup yields BLOCKED, not
                # CLEAN, so it still counts as a failure, not a pass.
                MERGE_STATE=$(gh pr view "$EXISTING_PR" --json mergeStateStatus --jq '.mergeStateStatus')
                if [ "$MERGE_STATE" != "CLEAN" ] && [ "$MERGE_STATE" != "HAS_HOOKS" ]; then
                  echo "⏸️  PR #$EXISTING_PR checks not all green/reported (mergeStateStatus: $MERGE_STATE). Skipping."
                  echo ""
                  continue
                fi

                APPROVALS=$(gh pr view "$EXISTING_PR" --json reviews --jq '[.reviews[] | select(.state == "APPROVED")] | length')
                if [ "$APPROVALS" -eq 0 ]; then
                  echo "⏸️  PR #$EXISTING_PR has no approvals. Skipping."
                  echo ""
                  continue
                fi

                echo "🔀 Attempting to merge existing PR #$EXISTING_PR..."
                if gh pr merge "$EXISTING_PR" --squash --delete-branch --auto 2>/dev/null; then
                  echo "✅ PR #$EXISTING_PR queued for auto-merge"
                  MERGED_COUNT=$((MERGED_COUNT + 1))
                else
                  echo "⚠️  Could not auto-merge PR #$EXISTING_PR (may need approval or have conflicts)"
                fi
              fi
              echo ""
              continue
            fi

            # Create PR
            if [ "$DRY_RUN" = "true" ]; then
              echo "🔍 [DRY RUN] Would create PR: $branch -> main"
              CREATED_COUNT=$((CREATED_COUNT + 1))
              echo ""
              continue
            fi

            echo "📝 Creating PR for $branch..."

            PR_TITLE="Merge $branch to main"
            PR_BODY="Automated merge of branch \`$branch\` into \`main\`. This PR was created by the merge-all-branches workflow."

            PR_CREATE_FAILED=false
            PR_OUTPUT=$(gh pr create \
              --base main \
              --head "$branch" \
              --title "$PR_TITLE" \
              --body "$PR_BODY" 2>&1) || PR_CREATE_FAILED=true

            if [ "$PR_CREATE_FAILED" = true ]; then
              # Check if error is because no commits
              if echo "$PR_OUTPUT" | grep -q "no commits"; then
                echo "ℹ️  Branch $branch has no new commits. Skipping and deleting..."
                SKIPPED_COUNT=$((SKIPPED_COUNT + 1))

                # Delete the branch
                if gh api -X DELETE "repos/:owner/:repo/git/refs/heads/$branch" 2>/dev/null; then
                  echo "🗑️  Deleted branch: $branch"
                  DELETED_COUNT=$((DELETED_COUNT + 1))
                else
                  echo "⚠️  Could not delete branch: $branch"
                fi
                echo ""
                continue
              fi

              echo "❌ Failed to create PR for $branch"
              echo "Error: $PR_OUTPUT"
              FAILED_COUNT=$((FAILED_COUNT + 1))
              echo ""
              continue
            fi

            # Extract PR number
            PR_NUMBER=$(echo "$PR_OUTPUT" | grep -o '/pull/[0-9]*' | sed 's|/pull/||' | head -1)
            echo "✅ Created PR #$PR_NUMBER"
            CREATED_COUNT=$((CREATED_COUNT + 1))

            # Try to auto-merge
            echo "🔀 Attempting to auto-merge PR #$PR_NUMBER..."
            if gh pr merge "$PR_NUMBER" --squash --delete-branch --auto 2>/dev/null; then
              echo "✅ PR #$PR_NUMBER queued for auto-merge"
              MERGED_COUNT=$((MERGED_COUNT + 1))
            else
              echo "⚠️  Could not auto-merge PR #$PR_NUMBER (may need approval or have conflicts)"
            fi

            echo ""

          done < branches_to_merge.txt

          echo "=========================================="
          echo "📊 Summary:"
          echo "   ✅ PRs created: $CREATED_COUNT"
          echo "   🔀 PRs merged/queued: $MERGED_COUNT"
          echo "   🗑️  Branches deleted: $DELETED_COUNT"
          echo "   📝 Existing PRs: $EXISTING_COUNT"
          echo "   ⏭️  Skipped (no commits): $SKIPPED_COUNT"
          echo "   ❌ Failed: $FAILED_COUNT"
          echo "=========================================="

          if [ "$DRY_RUN" = "true" ]; then
            echo ""
            echo "🔍 This was a DRY RUN. No actual changes were made."
            echo "ℹ️  To actually merge branches, run this workflow with dry_run=false"
          else
            echo ""
            echo "🎉 Workflow completed!"
            echo "ℹ️  PRs that were queued for auto-merge will be merged automatically once they pass CI and get approval."
            echo "ℹ️  Some PRs may need manual review and approval before they can be merged."
          fi

      - name: No branches to merge
        if: fromJSON(steps.get-branches.outputs.branch_count) == 0
        run: |
          echo "ℹ️  No branches found to merge."
