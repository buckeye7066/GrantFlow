name: Apply remaining GrantFlow audit corrections

on:
  push:
    branches:
      - agent/grantflow-audit-corrections-20260728

permissions:
  contents: write
  issues: write
  pull-requests: write

# Only the latest verifier owns the branch. A newer diagnostic revision cancels
# any obsolete run rather than allowing a queue of stale patches to accumulate.
concurrency:
  group: agent-grantflow-audit-corrections-20260728
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/grantflow-audit-corrections-20260728
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply audited corrections
        run: python3 scripts/agent-apply-audit-corrections.py

      - name: Verify patch shape
        run: |
          git diff --check
          git status --short

      - name: Run focused regression suite
        run: |
          npm exec -- vitest run \
            backend/tests/remainingAuditCorrections.test.js \
            backend/tests/amyAgent.test.js \
            backend/tests/needAnchoredScoring.test.js \
            backend/tests/fundingSourcesAccess.test.js

      - name: Run repository pre-push gates
        run: npm run check:prepush

      - name: Scan for secrets
        run: npm run scan:secrets

      - name: Remove one-shot agent scaffolding
        run: |
          rm scripts/agent-apply-audit-corrections.py
          rm .github/workflows/agent-grantflow-audit-corrections.yml

      - name: Commit verified corrections
        run: |
          git config user.name "GrantFlow Audit Agent"
          git config user.email "noreply@openai.com"
          git add -A -- \
            scripts/agent-apply-audit-corrections.py \
            .github/workflows/agent-grantflow-audit-corrections.yml \
            backend/routes/hamiltonAutomation.js \
            backend/routes/grantApplications.js \
            backend/routes/fundingSources.js \
            backend/services/hamilton/hamiltonTaskListing.js \
            backend/services/hamilton/applicationStatusPresentation.js \
            backend/services/amy/crawlerMetrics.js \
            backend/services/matching/fundingSourcePresentation.js \
            backend/services/matching/resourceDecisionGuard.js \
            backend/services/matchEngine.js \
            backend/tests/remainingAuditCorrections.test.js
          git diff --cached --check
          git commit -m "fix(audit): close remaining production-audit defects"
          git push origin HEAD:agent/grantflow-audit-corrections-20260728

      - name: Report verifier failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 1026 --body "Correction verifier failed. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
