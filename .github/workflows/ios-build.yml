name: iOS build

# Manual trigger only — macOS runners bill at 10x, and the unsigned build
# is only needed on demand. Produces grantflow-unsigned-ipa: an UNSIGNED
# .ipa proving the iOS build works end-to-end. App Store submission
# additionally needs Apple Developer signing (Distribution certificate +
# provisioning profile added as secrets, and a signed archive step).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://grantflow-production.up.railway.app
      - run: npx cap sync ios
      - name: Archive (unsigned)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -qry GrantFlow-unsigned.ipa Payload
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grantflow-unsigned-ipa
          path: ${{ runner.temp }}/GrantFlow-unsigned.ipa
          if-no-files-found: error
