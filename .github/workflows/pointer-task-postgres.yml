name: Pointer task PostgreSQL regression

on:
  pull_request:
    paths:
      - 'backend/services/hamilton/pointerTaskRepair.js'
      - 'backend/tests/pointerTaskPostgresBooleanRegression.test.js'
      - '.github/workflows/pointer-task-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'backend/services/hamilton/pointerTaskRepair.js'
      - 'backend/tests/pointerTaskPostgresBooleanRegression.test.js'
      - '.github/workflows/pointer-task-postgres.yml'

permissions:
  contents: read

concurrency:
  group: pointer-postgres-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pointer-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grantflow_pointer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d grantflow_pointer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=optional
      - name: Verify native PostgreSQL booleans and preserved task evidence
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import { spawnSync } from 'node:child_process'
          import { buildIsolatedTestEnv } from './scripts/test-environment.mjs'
          // Strip every inherited live credential, then inject ONLY the local
          // service-container URL. No additional product env flags are needed.
          const env = buildIsolatedTestEnv(process.env, {
            DATABASE_URL: 'postgres://postgres:postgres@127.0.0.1:5432/grantflow_pointer_test',
          })
          const child = spawnSync(process.execPath, [
            'node_modules/vitest/vitest.mjs', 'run',
            'backend/tests/pointerTaskPostgresBooleanRegression.test.js',
            '--reporter=json', '--outputFile=pointer-postgres-results.json',
          ], { stdio: 'inherit', env, timeout: 120000 })
          if (child.error) throw child.error
          assert.equal(child.status, 0, 'Native PostgreSQL test process must succeed')
          const result = JSON.parse(readFileSync('pointer-postgres-results.json', 'utf8'))
          assert.equal(result.success, true)
          assert.equal(result.numPassedTests, 11)
          assert.equal(result.numPendingTests, 0)
          console.log('All 11 pointer regressions passed, including 4 native PostgreSQL tests; none skipped.')
          JS
      - name: Verify existing SQLite startup invariant
        run: node scripts/run-vitest-isolated.mjs run backend/tests/pointerTaskStartupInvariant.test.js
