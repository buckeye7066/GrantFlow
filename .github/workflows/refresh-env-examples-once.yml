name: refresh-env-examples-once

on:
  push:
    branches:
      - agent/need-first-scoring-20260729

permissions:
  contents: write

concurrency:
  group: refresh-env-examples-once
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, 'chore(env): refresh generated examples') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/need-first-scoring-20260729
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: node scripts/generate-env-examples.mjs

      - name: Commit generated examples when changed
        run: |
          if git diff --quiet -- .env.example backend/.env.example; then
            echo 'Environment examples already current.'
            exit 0
          fi
          git config user.name 'grantflow-verifier[bot]'
          git config user.email 'grantflow-verifier[bot]@users.noreply.github.com'
          git add -- .env.example backend/.env.example
          git commit -m 'chore(env): refresh generated examples'
          git push origin HEAD:agent/need-first-scoring-20260729
