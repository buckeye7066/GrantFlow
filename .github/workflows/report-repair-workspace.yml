name: Report repair workspace
on:
  push:
    branches: ['fix/2026-09-06-report-repairs']
    paths: ['.github/workflows/report-repair-workspace.yml']
permissions:
  contents: write
jobs:
  apply-reviewed-edits:
    if: github.ref == 'refs/heads/fix/2026-09-06-report-repairs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate every original and result blob before applying any edit
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root = Path.cwd().resolve()
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          plans = []
          seen = set()
          for file in ['.github/report-repair-edits-1.json', '.github/report-repair-edits-2.json']:
              for item in json.loads(Path(file).read_text()):
                  name = item['path']
                  p = root / name
                  assert name not in seen and not p.is_symlink(), name
                  assert p.resolve().is_relative_to(root), name
                  assert name.startswith(('backend/', 'qa/', 'tests/', 'tools/eva-edge-runner/test/', 'docs/agent-sync/')), name
                  seen.add(name)
                  if item['before'] is None:
                      assert not p.exists(), name
                      old = b''
                  else:
                      old = p.read_bytes()
                      assert blob(old) == item['before'], 'Source changed: ' + name
                  lines = old.decode('utf-8').splitlines(keepends=True)
                  previous = len(lines)
                  for start, end, text in reversed(item['edits']):
                      assert 0 <= start <= end <= previous, name
                      lines[start:end] = [text]
                      previous = start
                  result = ''.join(lines).encode('utf-8')
                  assert blob(result) == item['after'], 'Result differs from tested source: ' + name
                  plans.append((p, result, name))
          assert len(plans) == 22
          for p, result, name in plans:
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(result)
              print(name, blob(result))
          subprocess.run(['git', 'add', '--'] + [name for _, _, name in plans], check=True)
          PY
          git rm .github/report-repair-edits-1.json .github/report-repair-edits-2.json
          git diff --cached --check
      - name: Run exact targeted regression cases
        run: node --test backend/crawler-os/tests/webQueries.test.mjs backend/crawler-os/tests/coverageSweepFreshness.test.mjs tests/unit/weekly-digest-failure.test.mjs
      - name: Run EVA process and manifest safeguards
        working-directory: tools/eva-edge-runner
        run: npm test
      - name: Commit and fast-forward only the repair branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: repair crawler query coverage, interrupted sweeps, digest evidence, and EVA port isolation'
          git push origin HEAD:refs/heads/fix/2026-09-06-report-repairs
