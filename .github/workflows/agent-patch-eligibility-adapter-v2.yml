name: Wire eligibility confirmation policy v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/eligibility-unconfirmed-cap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/eligibility-unconfirmed-cap
          fetch-depth: 0

      - name: Patch need-first scoring adapter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/services/matching/needFirstScoringAdapter.js')
          text = path.read_text(encoding='utf-8')

          import_line = "import { applyEligibilityConfirmationPolicy } from './eligibilityConfirmation.js'\n"
          if import_line not in text:
              anchor = "} from './needFirstMatchPolicy.js'\n"
              index = text.index(anchor) + len(anchor)
              text = text[:index] + import_line + text[index:]

          if 'const eligibilityPolicy = applyEligibilityConfirmationPolicy' not in text:
              marker = "  const previousExplain = canonical?.match_explain ?? {}"
              index = text.index(marker)
              block = """  const eligibilityPolicy = applyEligibilityConfirmationPolicy({
            canonical,
            score,
            decision: decisionResult.decision,
            explanation: decisionResult.explanation,
            reasons: decisionResult.reasons,
            resource: policy.resource,
          })
          score = eligibilityPolicy.score
          decisionResult.decision = eligibilityPolicy.decision
          decisionResult.explanation = eligibilityPolicy.explanation
          decisionResult.reasons = eligibilityPolicy.reasons
          const directEligibilityUnconfirmed =
            eligibilityPolicy.confirmation.unconfirmed && !policy.resource

          """
              block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
              text = text[:index] + block + text[index:]

          if 'eligibility_confirmation: {' not in text:
              anchor = "    scoring_policy_version: NEED_FIRST_SCORING_VERSION,\n"
              start = text.index('  const matchExplain = {')
              index = text.index(anchor, start) + len(anchor)
              block = """    eligibility_confirmation: {
                confirmed: !directEligibilityUnconfirmed,
                unconfirmed: directEligibilityUnconfirmed,
                missing_fields: eligibilityPolicy.confirmation.missingFields,
                all_missing_fields: eligibilityPolicy.confirmation.allMissingFields,
                score_cap: directEligibilityUnconfirmed
                  ? eligibilityPolicy.confirmation.scoreCap
                  : null,
                applied: eligibilityPolicy.applied,
              },
              eligibility_unconfirmed: directEligibilityUnconfirmed,
          """
              block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
              text = text[:index] + block + text[index:]

          if 'eligibility_confirmation_applied:' not in text:
              anchor = "      need_first_hard_mismatch: policy.hardMismatch,\n"
              start = text.index('    scoreBreakdown: {')
              index = text.index(anchor, start) + len(anchor)
              block = """      eligibility_unconfirmed: directEligibilityUnconfirmed,
                eligibility_unconfirmed_score_cap: directEligibilityUnconfirmed
                  ? eligibilityPolicy.confirmation.scoreCap
                  : null,
                eligibility_confirmation_applied: eligibilityPolicy.applied,
          """
              block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
              text = text[:index] + block + text[index:]

          if 'eligibilityUnconfirmed: directEligibilityUnconfirmed' not in text:
              anchor = "    scoringPolicyVersion: NEED_FIRST_SCORING_VERSION,\n"
              index = text.index(anchor) + len(anchor)
              block = """    eligibilityConfirmed: !directEligibilityUnconfirmed,
                eligibilityUnconfirmed: directEligibilityUnconfirmed,
          """
              block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
              text = text[:index] + block + text[index:]

          path.write_text(text, encoding='utf-8')
          for candidate in [
              '.github/workflows/agent-patch-eligibility-adapter.yml',
              '.github/workflows/agent-patch-eligibility-adapter-v2.yml',
              'qa/eligibility-adapter-trigger.txt',
          ]:
              target = Path(candidate)
              if target.exists():
                  target.unlink()
          PY

      - name: Commit adapter wiring
        shell: bash
        run: |
          git config user.name "GrantFlow Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(scoring): enforce eligibility-unconfirmed cap in need-first adapter"
          git push origin HEAD:fix/eligibility-unconfirmed-cap
