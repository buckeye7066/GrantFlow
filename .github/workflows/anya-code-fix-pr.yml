name: Anya Code Fix PR Creator

on:
  workflow_dispatch:
    inputs:
      patch_content:
        description: 'Unified diff patch content from Anya'
        required: true
        type: string
      branch_name:
        description: 'Branch name for the PR'
        required: true
        type: string
      pr_title:
        description: 'Pull request title'
        required: true
        type: string
      pr_description:
        description: 'Pull request description'
        required: true
        type: string
      base_branch:
        description: 'Base branch for PR (default: main)'
        required: false
        default: 'main'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr-from-patch:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Anya AI Assistant"
          git config user.email "anya@grantflow.app"

      - name: Create and checkout new branch
        run: |
          git checkout -b "${{ inputs.branch_name }}"

      - name: Validate patch content
        id: validate
        run: |
          # Check if patch content is not empty
          if [ -z "${{ inputs.patch_content }}" ]; then
            echo "Error: Patch content is empty"
            exit 1
          fi
          
          # Check if patch looks like a unified diff
          echo "${{ inputs.patch_content }}" | head -1 | grep -q "^diff" || {
            echo "Error: Patch does not appear to be a unified diff"
            exit 1
          }
          
          echo "Patch validation passed"

      - name: Save patch to file
        run: |
          cat << 'PATCH_EOF' > /tmp/anya-fix.patch
          ${{ inputs.patch_content }}
          PATCH_EOF

      - name: Apply patch
        id: apply_patch
        run: |
          # Try to apply the patch
          if git apply --check /tmp/anya-fix.patch 2>&1; then
            git apply /tmp/anya-fix.patch
            echo "patch_applied=true" >> $GITHUB_OUTPUT
          else
            echo "Error: Failed to apply patch"
            echo "patch_applied=false" >> $GITHUB_OUTPUT
            git apply /tmp/anya-fix.patch || true
            exit 1
          fi

      - name: Verify changes
        run: |
          # Show what changed
          git status
          git diff --stat
          
          # Ensure there are changes to commit
          if git diff --quiet; then
            echo "Warning: No changes were made by the patch"
            exit 1
          fi

      - name: Commit changes
        run: |
          git add -A
          git commit -m "${{ inputs.pr_title }}" -m "${{ inputs.pr_description }}"

      - name: Push branch
        run: |
          git push origin "${{ inputs.branch_name }}"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "${{ inputs.pr_title }}" \
            --body "${{ inputs.pr_description }}" \
            --base "${{ inputs.base_branch }}" \
            --head "${{ inputs.branch_name }}" \
            --label "anya-generated" \
            --label "automated"

      - name: Add PR comment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh pr view "${{ inputs.branch_name }}" --json number -q .number)
          gh pr comment "$PR_NUMBER" --body "🤖 This PR was automatically generated by Anya AI Assistant based on code analysis and fixes."
