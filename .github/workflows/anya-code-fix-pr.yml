name: Anya Code Fix PR
on:
  workflow_dispatch:
    inputs:
      patch_content:
        description: "Unified diff patch to apply"
        required: true
        type: string

jobs:
  apply_patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/patch.diff << 'PATCH'
          ${{ inputs.patch_content }}
          PATCH
          git apply /tmp/patch.diff

      - name: Show status
        run: |
          git status --porcelain
