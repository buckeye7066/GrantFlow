name: Anya Code Fix PR
on:
  workflow_dispatch:
    inputs:
      patch_content:
        description: "Unified diff patch to apply"
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply_patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        shell: bash
        env:
          PATCH_CONTENT: ${{ inputs.patch_content }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PATCH_CONTENT" > /tmp/patch.diff
          git apply /tmp/patch.diff

      - name: Show status
        run: |
          git status --porcelain
