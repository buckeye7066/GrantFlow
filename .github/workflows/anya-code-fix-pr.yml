name: Anya Code Fix PR
# The run-name embeds the (unique) landing branch so the backend direct-lander
# can CORRELATE this workflow_dispatch run to its branch — the run is dispatched
# on `main`, so its head_sha is main's, not the branch commit; correlation is by
# name, and the merged commit is read from the pushed branch ref.
run-name: "Anya Code Fix ${{ inputs.land_mode }} ${{ inputs.branch }}"
on:
  workflow_dispatch:
    inputs:
      patch_content:
        description: "Unified diff patch to apply"
        required: true
        type: string
      pr_title:
        description: "Optional short summary used in the PR title"
        required: false
        type: string
        default: ""
      automerge:
        description: "Queue CI-gated auto-merge on the PR (merges only when required checks are green)"
        required: false
        type: string
        default: "false"
      land_mode:
        description: "pr = open a PR (default, optional CI-gated auto-merge); gate_only = apply + run release:gates + assert ONLY declared files changed + push branch, then STOP. There is NO direct admin-merge here: the direct-to-main merge lives entirely in the backend (landPatchDirectToMain), gated by a single-use HMAC token + head_sha binding. A raw workflow_dispatch can NEVER admin-merge."
        required: false
        type: string
        default: "pr"
      branch:
        description: "Explicit branch name to push (gate_only passes a fresh unique branch the backend lander later merges). Empty = auto-generate."
        required: false
        type: string
        default: ""
      patch_sha256:
        description: "sha256 of patch_content, computed by the backend. gate_only refuses if the applied patch does not match."
        required: false
        type: string
        default: ""
      expected_paths:
        description: "Newline-separated repo-relative paths the validated patch declared. gate_only refuses if the working tree changes ANY other file."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  apply_patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Apply patch
        shell: bash
        env:
          PATCH_CONTENT: ${{ inputs.patch_content }}
          PATCH_SHA256_INPUT: ${{ inputs.patch_sha256 }}
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol lf
          printf '%s' "$PATCH_CONTENT" > /tmp/patch.diff

          # Bind the applied bytes to what the backend validated: sha256 of the
          # exact patch_content must equal the backend-supplied patch_sha256.
          if [ -n "$PATCH_SHA256_INPUT" ]; then
            ACTUAL_SHA="$(printf '%s' "$PATCH_CONTENT" | sha256sum | awk '{print $1}')"
            if [ "$ACTUAL_SHA" != "$PATCH_SHA256_INPUT" ]; then
              echo "patch_content sha256 ($ACTUAL_SHA) does not match backend-declared patch_sha256 ($PATCH_SHA256_INPUT) — refusing."
              exit 1
            fi
          fi

          if git apply --check /tmp/patch.diff; then
            git apply /tmp/patch.diff
            echo "Patch applied successfully."
          elif git apply --reverse --check /tmp/patch.diff; then
            echo "Patch already present. Continuing without failure."
          else
            echo "Patch cannot be applied cleanly and is not already present."
            exit 1
          fi

      - name: Show status
        run: |
          git status --porcelain

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: npm

      # `npm ci` with NO install fallback: `npm install` would rewrite
      # package-lock.json, and that churn would ride along into the commit
      # (Sol HIGH #3). A lockfile mismatch must FAIL the job, not be papered over.
      - name: Install deps
        run: npm ci --include=optional

      - name: Corruption hotspot guard
        run: node scripts/guard-corruption-hotspots.mjs

      - name: Code quality gate
        run: node scripts/code-quality-gate.mjs

      - name: Preflight gates
        run: npm run release:gates

      # After gates, ASSERT the working tree contains ONLY the files the
      # validated patch declared (no lockfile churn, generated artifacts, or
      # gate-written files) and that none hit the critical-path denylist. FAILS
      # the job on any undeclared/forbidden change, so exactly the verified diff
      # can be committed — nothing more (Sol HIGH #3).
      - name: Assert only declared files changed
        if: ${{ inputs.expected_paths != '' }}
        env:
          EXPECTED_PATHS: ${{ inputs.expected_paths }}
        run: node scripts/assert-direct-land-tree.mjs

      # NOTE: this step runs AFTER the gate steps above (corruption guard, code
      # quality, release:gates, declared-files assertion). `set -euo pipefail` +
      # step ordering guarantees a RED gate fails the job BEFORE any branch is
      # pushed — so a fix that is adversarially clean but fails release:gates (or
      # the declared-files assertion) NEVER lands, in ANY land_mode.
      - name: Create branch, commit, push
        env:
          # Prefer a PAT when provisioned: PRs created with the default
          # GITHUB_TOKEN do not trigger `on: pull_request` CI runs, so the
          # required checks (and therefore auto-merge) would wait forever.
          # With GITHUB_TOKEN the PR still opens and simply awaits review.
          GH_TOKEN: ${{ secrets.ANYA_PR_TOKEN != '' && secrets.ANYA_PR_TOKEN || secrets.GITHUB_TOKEN }}
          PR_TITLE_INPUT: ${{ inputs.pr_title }}
          AUTOMERGE_INPUT: ${{ inputs.automerge }}
          LAND_MODE_INPUT: ${{ inputs.land_mode }}
          BRANCH_INPUT: ${{ inputs.branch }}
          EXPECTED_PATHS: ${{ inputs.expected_paths }}
        run: |
          set -euo pipefail

          LAND_MODE="${LAND_MODE_INPUT:-pr}"
          if [ -n "$BRANCH_INPUT" ]; then
            BRANCH_NAME="$BRANCH_INPUT"
          else
            BRANCH_NAME="anya-fix/$(date -u +%Y%m%d-%H%M%S)"
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PR_TITLE="Anya Code Fix: apply patch"
          if [ -n "$PR_TITLE_INPUT" ]; then
            PR_TITLE="Anya Code Fix: $PR_TITLE_INPUT"
          fi

          git checkout -b "$BRANCH_NAME"

          # Commit ONLY the declared files when expected_paths was supplied
          # (never `git add -A` in that case), so an undeclared change can never
          # ride along. Without expected_paths (legacy manual PR dispatch) fall
          # back to add -A, but gate_only ALWAYS requires expected_paths below.
          if [ -n "$EXPECTED_PATHS" ]; then
            printf '%s\n' "$EXPECTED_PATHS" | while IFS= read -r p; do
              [ -n "$p" ] && git add -- "$p"
            done
          else
            git add -A
          fi
          git commit -m "fix: apply Anya code fix patch" -m "$PR_TITLE"
          git push origin "$BRANCH_NAME"

          # gate_only: gates + declared-files assertion already passed. Push the
          # branch and STOP. The BACKEND lander polls this run's conclusion +
          # head_sha and merges only on green + a valid single-use token + a
          # still-matching head. This workflow NEVER admin-merges.
          if [ "$LAND_MODE" = "gate_only" ]; then
            if [ -z "$EXPECTED_PATHS" ]; then
              echo "gate_only requires expected_paths (declared-files guard) — refusing."
              exit 1
            fi
            echo "gate_only: branch $BRANCH_NAME pushed after passing gates; backend lander will merge on green."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "$PR_TITLE" \
            --body "This PR was automatically created by the Anya Code Fix PR workflow after applying the provided patch and passing release:gates."

          # PR path only: optional CI-gated auto-merge. GitHub completes it once
          # every required branch-protection check is green (never an admin
          # bypass here). Failure to queue leaves the PR open for review.
          if [ "$AUTOMERGE_INPUT" = "true" ]; then
            gh pr merge "$BRANCH_NAME" --squash --auto \
              || echo "auto-merge could not be queued; PR remains open for manual review."
          fi
