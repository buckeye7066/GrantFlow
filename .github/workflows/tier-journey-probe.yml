name: Tier journey probe

on:
  push:
    branches: [fix/tier-journey-20260918]

permissions:
  contents: read

concurrency:
  group: tier-journey-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install existing locked dependencies
        run: npm ci --include=dev --include=optional
      - name: Verify the profile regression tests
        run: node scripts/run-vitest-isolated.mjs run src/utils/__tests__/profileLocationAliases.test.js src/utils/__tests__/profileSuggestionGuards.test.js src/components/profiles/__tests__/ProfileSectionEditor.location-roundtrip.test.jsx src/components/profiles/__tests__/ProfileSectionEditor.schoolOrigin.test.jsx src/components/profiles/__tests__/ProfileSectionEditor.test.jsx backend/tests/profileSuggestionGuards.test.js
      - name: Install browser
        run: node node_modules/playwright/cli.js install chromium --with-deps > /tmp/browser-install.log 2>&1 || { tail -80 /tmp/browser-install.log; exit 1; }
      - name: Build the real application
        run: npm run build > /tmp/journey-build.log 2>&1 || { tail -80 /tmp/journey-build.log; exit 1; }
      - name: Execute browser journeys against the committed application
        run: npm run test:ux -- --max-failures=1
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tier-journey-evidence-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: warn
