name: Tier journey probe

on:
  push:
    branches: [fix/tier-journey-20260918]

permissions:
  contents: read

concurrency:
  group: tier-journey-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install existing locked dependencies
        run: npm ci --include=dev --include=optional
      - name: Install browser
        run: node node_modules/playwright/cli.js install chromium --with-deps > /tmp/browser-install.log 2>&1 || { tail -80 /tmp/browser-install.log; exit 1; }
      - name: Build the real application
        run: npm run build > /tmp/journey-build.log 2>&1 || { tail -80 /tmp/journey-build.log; exit 1; }
      - name: Initialize the disposable fixture using real verification
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const path = 'tests/ux/server.mjs';
          let source = fs.readFileSync(path, 'utf8');
          if (!source.includes('await enforcePipelinePrecision(db)')) {
            if (!source.includes('const port = 18133')) throw new Error('Fixture insertion point missing');
            source = source.replace('const port = 18133', `
          const { enforcePipelinePrecision } = await import('../../backend/startup/enforceInvariants.js')
          const { readHamiltonTaskTruthSnapshot } = await import('../../backend/services/hamilton/hamiltonTaskTruthSnapshot.js')
          await enforcePipelinePrecision(db)
          const truth = await readHamiltonTaskTruthSnapshot(db)
          if (!truth.queueReadable) throw new Error('Local UX task verification failed: ' + truth.status)
          console.log('UX task verification:', truth.status)
          const port = 18133`);
            fs.writeFileSync(path, source);
          }
          JS
      - name: Execute the individual-tier browser journey
        run: npm run test:ux -- individual-tier.spec.mjs --max-failures=1
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tier-journey-evidence-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: warn
