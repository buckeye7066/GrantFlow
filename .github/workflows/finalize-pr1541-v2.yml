name: Finalize PR 1541 with published evidence

on:
  push:
    branches: [fix/production-cors-current-main-20260905]
    paths:
      - .github/workflows/finalize-pr1541-v2.yml
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  group: finalize-pr1541
  cancel-in-progress: true

jobs:
  verify-clean-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Detect whether PR 1541 is already merged
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          merged="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1541" --jq '.merged')"
          echo "already_merged=$merged" >> "$GITHUB_OUTPUT"
          if [ "$merged" = true ]; then
            echo "PR #1541 is already merged; no branch mutation is required." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prove the application diff is only the reviewed CORS repair
        if: steps.pr.outputs.already_merged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --check origin/main...HEAD
          changed="$({
            git diff --name-only origin/main...HEAD \
              | grep -Ev '^\.github/workflows/(diagnose-pr1541-unit-lanes(-v3)?|finalize-pr1541(-v2)?)\.yml$|^diagnostics/pr1541-unit-lanes\.md$' \
              || true
          } | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/ci.yml \
            backend/config/env.js \
            tests/unit/admin-email.test.mjs \
            tests/unit/auth-access-check.test.mjs \
            tests/unit/auth-email-production-503.test.mjs \
            | sort)"
          if [ "$changed" != "$expected" ]; then
            printf 'Unexpected application diff.\nExpected:\n%s\nActual:\n%s\n' "$expected" "$changed" | tee diff-contract-failure.txt
            exit 1
          fi

      - name: Setup Node
        if: steps.pr.outputs.already_merged != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install exact dependencies
        if: steps.pr.outputs.already_merged != 'true'
        run: npm ci --include=optional

      - name: Run every local release lane and retain exact output
        if: steps.pr.outputs.already_merged != 'true'
        id: lanes
        shell: bash
        run: |
          set +e
          mkdir -p finalizer-evidence

          run_lane() {
            name="$1"
            shift
            "$@" > "finalizer-evidence/${name}.log" 2>&1
            code=$?
            printf '%s=%s\n' "$name" "$code" >> finalizer-evidence/exits.env
            return 0
          }

          run_lane lint npm run lint
          run_lane typecheck npm run typecheck
          run_lane build npm run build
          run_lane dependency_audit npm audit --omit=dev --audit-level=high
          UNIT_TEST_CONCURRENCY=2 run_lane unit npm run unit
          run_lane regression node scripts/run-vitest-isolated.mjs run --config vitest.suite.config.js
          run_lane release_gates npm run release:gates

          cat finalizer-evidence/exits.env
          failed=0
          while IFS='=' read -r lane code; do
            if [ "$code" != 0 ]; then failed=1; fi
          done < finalizer-evidence/exits.env
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build bounded failure report
        if: steps.pr.outputs.already_merged != 'true' && steps.lanes.outputs.failed == '1'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '<!-- pr1541-finalizer-v2 -->'
            echo '## Exact-head PR #1541 verification remains red'
            echo
            echo "Source SHA: \`$(git rev-parse HEAD)\`"
            echo
            echo '| Lane | Exit code |'
            echo '|---|---:|'
            while IFS='=' read -r lane code; do
              echo "| \`$lane\` | $code |"
            done < finalizer-evidence/exits.env
            for log in finalizer-evidence/*.log; do
              lane="$(basename "$log" .log)"
              code="$(awk -F= -v lane="$lane" '$1==lane{print $2}' finalizer-evidence/exits.env)"
              [ "$code" = 0 ] && continue
              echo
              echo "### $lane failure evidence"
              echo '```text'
              grep -nEi '(^|[[:space:]])(not ok|fail(ed|ure)?|assertionerror|error:|err_|unhandled|test files|tests|timed out|timeout|killed|signal)' "$log" | tail -n 240 || true
              echo
              echo '--- terminal 320 lines ---'
              tail -n 320 "$log" || true
              echo '```'
            done
          } > finalizer-evidence/pr-comment.md

      - name: Publish failure evidence to PR 1541
        if: steps.pr.outputs.already_merged != 'true' && steps.lanes.outputs.failed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 1541 --body-file finalizer-evidence/pr-comment.md
          cat finalizer-evidence/pr-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete finalizer evidence
        if: steps.pr.outputs.already_merged != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1541-finalizer-evidence
          path: finalizer-evidence
          retention-days: 3
          if-no-files-found: error

      - name: Stop before mutation when any release lane failed
        if: steps.pr.outputs.already_merged != 'true' && steps.lanes.outputs.failed == '1'
        shell: bash
        run: exit 1

      - name: Remove one-time diagnostic machinery
        if: steps.pr.outputs.already_merged != 'true' && steps.lanes.outputs.failed == '0'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-pr1541-unit-lanes.yml
          rm -f .github/workflows/diagnose-pr1541-unit-lanes-v3.yml
          rm -f .github/workflows/finalize-pr1541.yml
          rm -f .github/workflows/finalize-pr1541-v2.yml
          rm -f diagnostics/pr1541-unit-lanes.md
          rmdir diagnostics 2>/dev/null || true
          git add -A
          git diff --cached --check

      - name: Publish the clean verified PR head
        if: steps.pr.outputs.already_merged != 'true' && steps.lanes.outputs.failed == '0'
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove completed PR 1541 diagnostics"
          fi
          git push origin HEAD:fix/production-cors-current-main-20260905
          final_sha="$(git rev-parse HEAD)"
          echo "sha=$final_sha" >> "$GITHUB_OUTPUT"

          git fetch origin main
          final_changed="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/ci.yml \
            backend/config/env.js \
            tests/unit/admin-email.test.mjs \
            tests/unit/auth-access-check.test.mjs \
            tests/unit/auth-email-production-503.test.mjs \
            | sort)"
          test "$final_changed" = "$expected"

      - name: Wait for exact-head repository and deployment checks
        if: steps.pr.outputs.already_merged != 'true' && steps.lanes.outputs.failed == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.publish.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 4200))
          required_patterns=(
            '^test-suite$'
            '^test$'
            'Windows build compatibility'
            '^postgres-migrations$'
            '^browser-smoke$'
            '^production-image$'
            'CodeQL|Analyze'
          )

          while [ "$SECONDS" -lt "$deadline" ]; do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${FINAL_SHA}/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name,.status,(.conclusion // "")] | @tsv' \
              | sort -u > /tmp/checks.tsv
            gh api "repos/${GITHUB_REPOSITORY}/commits/${FINAL_SHA}/status" \
              --jq '.statuses[] | [.context,.state] | @tsv' \
              | sort -u > /tmp/statuses.tsv

            present=1
            for pattern in "${required_patterns[@]}"; do
              if ! awk -F '\t' '{print $1}' /tmp/checks.tsv | grep -Eq "$pattern"; then
                present=0
              fi
            done

            pending="$(awk -F '\t' '$2 != "completed" {count++} END {print count+0}' /tmp/checks.tsv)"
            bad="$(awk -F '\t' '$2 == "completed" && $3 !~ /^(success|neutral|skipped)$/ {count++} END {print count+0}' /tmp/checks.tsv)"
            deploy_pending="$(awk -F '\t' '$2 == "pending" {count++} END {print count+0}' /tmp/statuses.tsv)"
            deploy_bad="$(awk -F '\t' '$2 ~ /^(error|failure)$/ {count++} END {print count+0}' /tmp/statuses.tsv)"

            vercel_ok=0
            railway_ok=0
            awk -F '\t' 'tolower($1) ~ /vercel/ && $2 == "success" {found=1} END {exit !found}' /tmp/statuses.tsv && vercel_ok=1 || true
            awk -F '\t' 'tolower($1) ~ /railway/ && $2 == "success" {found=1} END {exit !found}' /tmp/statuses.tsv && railway_ok=1 || true

            if [ "$present" = 1 ] && [ "$pending" = 0 ] && [ "$bad" = 0 ] && \
               [ "$deploy_pending" = 0 ] && [ "$deploy_bad" = 0 ] && \
               [ "$vercel_ok" = 1 ] && [ "$railway_ok" = 1 ]; then
              {
                echo '### Exact-head checks accepted'
                echo
                echo '```text'
                cat /tmp/checks.tsv
                echo
                cat /tmp/statuses.tsv
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if [ "$bad" -gt 0 ] || [ "$deploy_bad" -gt 0 ]; then
              echo 'A binding exact-head check failed.'
              cat /tmp/checks.tsv
              cat /tmp/statuses.tsv
              exit 1
            fi
            sleep 30
          done

          echo 'Timed out waiting for the complete exact-head check set.'
          cat /tmp/checks.tsv || true
          cat /tmp/statuses.tsv || true
          exit 1

      - name: Merge the exact verified PR head
        if: steps.pr.outputs.already_merged != 'true' && steps.lanes.outputs.failed == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.publish.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api \
            --method PUT \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/pulls/1541/merge" \
            -f merge_method=squash \
            -f sha="$FINAL_SHA" \
            -f commit_title='fix: require explicit production CORS origins' \
            -f commit_message='Fail closed when deployed runtimes omit an explicit non-wildcard CORS origin; keep production-shaped tests and the production-image proof aligned.')"
          printf '%s\n' "$response" | jq -e '.merged == true'
          echo "Merged PR #1541 as $(printf '%s\n' "$response" | jq -r '.sha')" >> "$GITHUB_STEP_SUMMARY"
