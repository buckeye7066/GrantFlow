name: Diagnose PR 1536 unit failure

on:
  push:
    branches: [fix/vnext-transition-integrity-current-main-20260904]
    paths:
      - .github/workflows/diagnose-pr1536-unit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --include=optional
      - name: Capture complete unit output
        id: unit
        shell: bash
        run: |
          set +e
          npm run unit > unit-complete.log 2>&1
          status=$?
          tail -n 500 unit-complete.log > unit-failure-tail.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1536-unit-diagnostic
          path: |
            unit-complete.log
            unit-failure-tail.log
          retention-days: 1
          if-no-files-found: error
