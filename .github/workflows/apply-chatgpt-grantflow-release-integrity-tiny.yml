name: Apply ChatGPT GrantFlow release integrity

on:
  push:
    branches:
      - chatgpt/production-ready/grantflow
    paths:
      - scripts/chatgpt-release-fix/**
      - .github/workflows/apply-chatgpt-grantflow-release-integrity-tiny.yml

permissions:
  contents: write

concurrency:
  group: apply-chatgpt-grantflow-release-integrity-tiny
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/production-ready/grantflow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: Syntax-check asserted transformations
        run: |
          for file in scripts/chatgpt-release-fix/*.mjs; do
            node --check "$file"
          done

      - name: Extract the route registry from the React module
        run: node scripts/chatgpt-release-fix/00-route-registry.mjs

      - name: Apply complete-catalog mission-health changes
        run: |
          node scripts/chatgpt-release-fix/01-mission-small.mjs
          node scripts/chatgpt-release-fix/02-mission-snapshot.mjs
          node scripts/chatgpt-release-fix/03-mission-alerts.mjs
          node scripts/chatgpt-release-fix/04-mission-tests.mjs

      - name: Apply deployment-proof and runtime identity changes
        run: |
          node scripts/chatgpt-release-fix/05-proof-first.mjs
          node scripts/chatgpt-release-fix/06-proof-second.mjs
          node scripts/chatgpt-release-fix/07-proof-third.mjs
          node scripts/chatgpt-release-fix/08-runtime-config.mjs

      - name: Validate generated source and configuration
        run: |
          git diff --check
          node --check src/pages/routeNames.js
          node --check shared/releaseIdentity.js
          node --check scripts/deployment-version-plugin.mjs
          node --check backend/routes/version.js
          node --check backend/services/missionHealthService.js
          node --check scripts/production-deployment-proof.mjs
          node --check tests/unit/release-identity.test.mjs
          node --check tests/unit/deployment-version-contract.test.mjs
          node --check tests/mission/mission-health-dashboard.test.mjs
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"

      - name: Install locked dependencies
        run: npm ci --include=dev --include=optional --legacy-peer-deps

      - name: Run release-integrity and complete-catalog tests
        run: >-
          node --test
          tests/unit/release-identity.test.mjs
          tests/unit/deployment-version-contract.test.mjs
          tests/mission/mission-health-dashboard.test.mjs

      - name: Run full lint, typecheck, and production build
        run: |
          npm run lint:ci
          npm run typecheck
          npm run build

      - name: Remove one-shot patch machinery
        run: |
          rm -rf scripts/chatgpt-release-fix
          rm .github/workflows/apply-chatgpt-grantflow-release-integrity-tiny.yml

      - name: Commit validated release-integrity changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(release): bind catalog and deployment evidence"
          git push origin HEAD:chatgpt/production-ready/grantflow
