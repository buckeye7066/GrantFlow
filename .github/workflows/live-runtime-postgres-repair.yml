name: Live runtime PostgreSQL repair
on:
  push:
    branches: [fix/live-runtime-postgres-20260905]
    paths: [.github/workflows/live-runtime-postgres-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: grantflow
          POSTGRES_PASSWORD: grantflow
          POSTGRES_DB: grantflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grantflow -d grantflow"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install locked dependencies
        run: npm ci --include=dev --include=optional --legacy-peer-deps
      - name: Reproduce PostgreSQL boolean/integer defect
        env:
          DATABASE_URL: postgresql://grantflow:grantflow@127.0.0.1:5432/grantflow
          DB_PROVIDER: postgres
          NODE_ENV: test
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          try {
            await pool.query('CREATE TEMP TABLE funding_opportunities (is_active BOOLEAN, is_hidden BOOLEAN)');
            let failed = false;
            try { await pool.query('SELECT 1 FROM funding_opportunities o WHERE COALESCE(o.is_active, 1) = 1'); }
            catch (error) { failed = /COALESCE types boolean and integer/i.test(String(error.message)); }
            if (!failed) throw new Error('Baseline did not reproduce the production PostgreSQL type failure');
            const active = await pool.query('SELECT 1 FROM funding_opportunities o WHERE o.is_active IS NOT FALSE');
            const hidden = await pool.query('SELECT 1 FROM funding_opportunities o WHERE o.is_hidden IS NOT TRUE');
            if (!active || !hidden) throw new Error('Boolean predicates did not parse');
          } finally { await pool.end(); }
          JS
      - name: Apply dialect-neutral boolean predicates
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'backend/services/pipelinePromotion.js';
          let source = readFileSync(path, 'utf8');
          const replacements = [
            ['AND COALESCE(o.is_active, 1) = 1', 'AND o.is_active IS NOT FALSE'],
            ['AND COALESCE(o.is_hidden, 0) = 0', 'AND o.is_hidden IS NOT TRUE'],
          ];
          for (const [from, to] of replacements) {
            const count = source.split(from).length - 1;
            if (count !== 2) throw new Error(`Expected exactly 2 occurrences of ${from}; found ${count}`);
            source = source.split(from).join(to);
          }
          writeFileSync(path, source);
          JS
          node --input-type=module <<'JS'
          import Database from 'better-sqlite3';
          const db = new Database(':memory:');
          db.exec('CREATE TABLE funding_opportunities (is_active INTEGER, is_hidden INTEGER)');
          db.prepare('SELECT 1 FROM funding_opportunities o WHERE o.is_active IS NOT FALSE AND o.is_hidden IS NOT TRUE').all();
          db.close();
          JS
          git diff --check
      - name: Verify PostgreSQL predicates after repair
        env:
          DATABASE_URL: postgresql://grantflow:grantflow@127.0.0.1:5432/grantflow
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          try {
            await pool.query('CREATE TEMP TABLE funding_opportunities (is_active BOOLEAN, is_hidden BOOLEAN)');
            await pool.query('INSERT INTO funding_opportunities VALUES (TRUE,FALSE),(NULL,NULL),(FALSE,FALSE),(TRUE,TRUE)');
            const result = await pool.query('SELECT count(*)::int AS n FROM funding_opportunities o WHERE o.is_active IS NOT FALSE AND o.is_hidden IS NOT TRUE');
            if (result.rows[0].n !== 2) throw new Error(`Unexpected PostgreSQL predicate semantics: ${result.rows[0].n}`);
          } finally { await pool.end(); }
          JS
      - name: Run repository verification
        run: |
          npm run lint:ci
          npm run typecheck
          npm run unit
          npm run build
          npm run deployment-config:check
      - name: Commit verified repair and remove temporary workflow
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/live-runtime-postgres-repair.yml
          git add backend/services/pipelinePromotion.js .github/workflows/live-runtime-postgres-repair.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: use dialect-neutral promotion boolean predicates'
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/live-runtime-postgres-20260905
