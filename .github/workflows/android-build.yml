name: Android build and repo-direct release

# A passing main build publishes a signed APK to GitHub Releases so a
# repo-direct updater can detect and install updates. The first signed release
# establishes the persistent signing certificate; later releases verify that
# certificate before producing an update.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_VERSION_CODE: ${{ github.run_number }}
  ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  android:
    name: Build signed APK + AAB
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - name: Run authoritative release gates
        env:
          VITE_API_URL: https://grantflow-production.up.railway.app
        run: node scripts/release-gates.mjs
      - name: Switch to Capacitor Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version-mobile
          cache: 'npm'
      - name: Sync verified web build into Android
        run: npx cap sync android
      - name: Require persistent Android signing identity
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'ANDROID_KEYSTORE_BASE64 is missing'; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'ANDROID_KEYSTORE_PASSWORD is missing'; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'ANDROID_KEY_ALIAS is missing'; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'ANDROID_KEY_PASSWORD is missing'; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          keytool -list -v \
            -keystore "$RUNNER_TEMP/upload.jks" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}' \
            > "$RUNNER_TEMP/keystore-cert.sha256"
          test -s "$RUNNER_TEMP/keystore-cert.sha256"

          BASELINE_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("android-v"))][0].tagName // ""')
          if [ -n "$BASELINE_TAG" ]; then
            mkdir -p "$RUNNER_TEMP/signing-baseline"
            gh release download "$BASELINE_TAG" --repo "$GITHUB_REPOSITORY" --pattern grantflow-signing-cert.sha256 --dir "$RUNNER_TEMP/signing-baseline"
            test -s "$RUNNER_TEMP/signing-baseline/grantflow-signing-cert.sha256" || { echo "Existing Android release lacks signing fingerprint"; exit 1; }
            cmp "$RUNNER_TEMP/signing-baseline/grantflow-signing-cert.sha256" "$RUNNER_TEMP/keystore-cert.sha256" || { echo 'Configured keystore certificate differs from prior Android releases'; exit 1; }
          else
            echo 'No prior signed Android release: this main build will establish the signing fingerprint bootstrap.'
          fi
      - name: Build signed release APK and AAB
        run: ./gradlew assembleRelease bundleRelease --no-daemon
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ env.ANDROID_VERSION_CODE }}
          ANDROID_VERSION_NAME: ${{ env.ANDROID_VERSION_NAME }}
      - name: Verify signing certificate and prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/release/app-release.apk'
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          test -f "$APK"
          test -f "$AAB"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/apk-certs.txt"
          node scripts/extract-apk-cert-fingerprints.mjs \
            < "$RUNNER_TEMP/apk-certs.txt" \
            > "$RUNNER_TEMP/apk-cert-candidates.sha256"
          grep -Fqx -- "$(cat "$RUNNER_TEMP/keystore-cert.sha256")" "$RUNNER_TEMP/apk-cert-candidates.sha256" || { echo 'Built APK signing certificates do not include the configured persistent keystore certificate'; exit 1; }
          cp "$APK" "GrantFlow-${ANDROID_VERSION_NAME}.apk"
          cp "$AAB" "GrantFlow-${ANDROID_VERSION_NAME}.aab"
          cp "$RUNNER_TEMP/keystore-cert.sha256" grantflow-signing-cert.sha256
          sha256sum "GrantFlow-${ANDROID_VERSION_NAME}.apk" > grantflow-android.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grantflow-signed-android
          path: |
            GrantFlow-*.apk
            GrantFlow-*.aab
            grantflow-android.sha256
            grantflow-signing-cert.sha256
          if-no-files-found: error

  publish:
    name: Publish repo-direct Android release
    needs: android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: grantflow-signed-android
      - name: Publish GitHub Release for phone updater
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-v${ANDROID_VERSION_NAME}"
          NOTES=$(cat <<EOF
          Automated Android release from main.

          Source SHA: ${GITHUB_SHA}
          Android version: ${ANDROID_VERSION_NAME} (${ANDROID_VERSION_CODE})
          Package: com.grantflow.app

          Android requires the same signing certificate as the installed copy. If the phone currently has an older CI debug-signed APK, follow docs/android-repo-update.md for the one-time signed bootstrap.
          EOF
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            TARGET=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
            test "$TARGET" = "$GITHUB_SHA" || { echo "Existing $TAG targets $TARGET, expected $GITHUB_SHA"; exit 1; }
            gh release upload "$TAG" \
              "GrantFlow-${ANDROID_VERSION_NAME}.apk" \
              "GrantFlow-${ANDROID_VERSION_NAME}.aab" \
              grantflow-android.sha256 \
              grantflow-signing-cert.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "GrantFlow Android ${ANDROID_VERSION_NAME}" \
              --notes "$NOTES" \
              --draft=false
          else
            gh release create "$TAG" \
              "GrantFlow-${ANDROID_VERSION_NAME}.apk" \
              "GrantFlow-${ANDROID_VERSION_NAME}.aab" \
              grantflow-android.sha256 \
              grantflow-signing-cert.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "GrantFlow Android ${ANDROID_VERSION_NAME}" \
              --notes "$NOTES"
          fi
