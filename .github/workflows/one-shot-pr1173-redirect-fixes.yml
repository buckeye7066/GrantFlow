name: One-shot PR 1173 redirect fixes

on:
  push:
    branches:
      - fix/ssrf-egress-chokepoint-payment-cap-otp-csprng

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[redirect-review-fixes-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/ssrf-egress-chokepoint-payment-cap-otp-csprng
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.20.2
          cache: npm

      - name: Apply exact redirect and SNI fixes
        run: node scripts/one-shot-pr1173-redirect-fixes.mjs

      - name: Parse-check modified files
        run: |
          node --check backend/services/http/safeFetch.js
          node --check backend/tests/safeFetchSsrf.test.js

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run focused egress regressions
        run: >-
          node scripts/run-vitest-isolated.mjs run
          backend/tests/safeFetchSsrf.test.js
          backend/tests/paymentAuthorizationCap.test.js

      - name: Run repository pre-push gates
        run: npm run check:prepush

      - name: Commit verified fixes and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GrantFlow Security Repair"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/one-shot-pr1173-redirect-fixes.mjs
          git rm .github/workflows/one-shot-pr1173-redirect-fixes.yml
          git add backend/services/http/safeFetch.js backend/tests/safeFetchSsrf.test.js
          git commit -m "fix(security): normalize redirects and IP-literal SNI [redirect-review-fixes-complete]"
          git push origin HEAD:fix/ssrf-egress-chokepoint-payment-cap-otp-csprng
