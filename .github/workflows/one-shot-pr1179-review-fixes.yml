name: One-shot PR 1179 review fixes

on:
  push:
    branches:
      - fix/match-authority-soft-penalty-and-display-parity

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[match-review-fixes-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout matching branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/match-authority-soft-penalty-and-display-parity
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.20.2
          cache: npm

      - name: Apply exact review fixes
        run: node scripts/one-shot-pr1179-review-fixes.mjs

      - name: Parse-check modified modules and tests
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/config/demographicRestrictionPatterns.js
          node --check backend/config/matchThresholds.js
          node --check backend/services/relevanceFilterRules.js
          node --check backend/services/opportunityNormalizer.js
          node --check backend/services/matchEngine.js
          node --check src/lib/discoverCatalogKeep.js
          node --check backend/tests/matchEngineSoftRelevanceAndMatchFunds.test.js
          node --check backend/tests/matchThresholdsSoftPenalty.test.js
          node --check tests/unit/discoverCatalogKeep.test.js

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Regenerate and verify environment contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-env-examples.mjs
          node scripts/check-env-examples.mjs

      - name: Run focused matching and display regressions
        run: >-
          node scripts/run-vitest-isolated.mjs run
          backend/tests/matchEngineSoftRelevanceAndMatchFunds.test.js
          backend/tests/matchThresholdsSoftPenalty.test.js
          backend/tests/relevanceFilter.softMode.test.js
          backend/tests/relevanceFilterRules.test.js
          backend/tests/opportunityNormalizerEligibilityText.test.js
          tests/unit/discoverCatalogKeep.test.js

      - name: Run repository pre-push gates
        run: npm run check:prepush

      - name: Commit verified fixes and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GrantFlow Match Repair"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/one-shot-pr1179-review-fixes.mjs
          git rm .github/workflows/one-shot-pr1179-review-fixes.yml
          git add \
            .env.example \
            backend/.env.example \
            backend/config/demographicRestrictionPatterns.js \
            backend/config/matchThresholds.js \
            backend/services/relevanceFilterRules.js \
            backend/services/opportunityNormalizer.js \
            backend/services/matchEngine.js \
            backend/tests/matchEngineSoftRelevanceAndMatchFunds.test.js \
            backend/tests/matchThresholdsSoftPenalty.test.js \
            src/lib/discoverCatalogKeep.js \
            src/pages/DiscoverGrants.jsx \
            tests/unit/discoverCatalogKeep.test.js
          git commit -m "fix(match): close authority and recovery review gaps [match-review-fixes-complete]"
          git push origin HEAD:fix/match-authority-soft-penalty-and-display-parity
