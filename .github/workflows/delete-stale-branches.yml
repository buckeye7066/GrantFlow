name: Delete Stale Branches

on:
  # Manual trigger — run from the Actions tab in GitHub
  workflow_dispatch:
    inputs:

permissions:
  contents: write

jobs:
  delete-stale-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Delete all non-main remote branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          echo "Fetching all remote branches..."
          git fetch --all --prune

          # Collect all branches except 'main' and the branch this workflow is running on
          BRANCHES=$(gh api repos/:owner/:repo/branches --paginate --jq ".[].name" \
            | grep -v '^main$' \
            | grep -v "^${CURRENT_BRANCH}$" || true)

          BRANCH_COUNT=$(echo "$BRANCHES" | grep -c . || true)

          if [[ "$BRANCH_COUNT" -eq 0 ]]; then
            echo "✅ No stale branches found. Only 'main' exists."
            exit 0
          fi

          echo "Found $BRANCH_COUNT branch(es) to delete:"
          echo "──────────────────────────────────────────"
          echo "$BRANCHES"
          echo "──────────────────────────────────────────"
          echo ""

          DELETED=0
          FAILED=0

          while IFS= read -r branch; do
            [[ -z "$branch" ]] && continue
            echo -n "  Deleting '$branch'... "
            if gh api -X DELETE "repos/:owner/:repo/git/refs/heads/$branch" 2>/dev/null; then
              echo "✅ deleted"
              DELETED=$((DELETED + 1))
            else
              echo "❌ failed (already deleted or permission denied)"
              FAILED=$((FAILED + 1))
            fi
          done <<< "$BRANCHES"

          echo ""
          echo "════════════════════════════════════════════"
          echo "✅ Deleted : $DELETED branch(es)"
          echo "❌ Failed  : $FAILED branch(es)"
          if [[ "$FAILED" -eq 0 ]]; then
            echo "Only 'main' remains."
          else
            echo "Cleanup complete. Some branches could not be deleted (see above)."
          fi
          echo "════════════════════════════════════════════"
