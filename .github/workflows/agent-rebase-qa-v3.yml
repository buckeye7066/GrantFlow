name: Rebuild QA remaining gaps on current main

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/qa-36-remaining-gaps-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qa-36-remaining-gaps-v2
          fetch-depth: 0

      - name: Create clean branch from current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main fix/qa-36-remaining-gaps-v2
          git config user.name "GrantFlow Repair Bot"
          git config user.email "actions@users.noreply.github.com"

          git switch -C fix/qa-36-remaining-gaps-v3 origin/main
          for path in \
            backend/config/productionProfileScope.js \
            backend/routes/fundingSources.js \
            backend/services/crawlerOsCompatibility.js \
            backend/services/matching/coldStartFundingFallback.js \
            backend/services/profile/profileConfiguration.js \
            backend/services/shared/liveWebSearch.js \
            backend/tests/coldStartFundingFallback.test.js \
            backend/tests/fundingSourcesColdStartAuditGuard.test.js \
            backend/tests/productionProfileMatchingScope.test.js \
            src/pages/ItemFunding.jsx \
            src/pages/itemFundingMatch.js \
            src/pages/itemFundingMatch.test.js
          do
            git checkout origin/fix/qa-36-remaining-gaps-v2 -- "$path"
          done
          git add \
            backend/config/productionProfileScope.js \
            backend/routes/fundingSources.js \
            backend/services/crawlerOsCompatibility.js \
            backend/services/matching/coldStartFundingFallback.js \
            backend/services/profile/profileConfiguration.js \
            backend/services/shared/liveWebSearch.js \
            backend/tests/coldStartFundingFallback.test.js \
            backend/tests/fundingSourcesColdStartAuditGuard.test.js \
            backend/tests/productionProfileMatchingScope.test.js \
            src/pages/ItemFunding.jsx \
            src/pages/itemFundingMatch.js \
            src/pages/itemFundingMatch.test.js
          git commit -m "fix(qa): finish cold-start, internal-profile, and item-score gaps"
          git push --force-with-lease origin HEAD:fix/qa-36-remaining-gaps-v3

          git switch -C fix/qa-36-remaining-gaps-v2 origin/fix/qa-36-remaining-gaps-v2
          rm -f .github/workflows/agent-rebase-qa-v3.yml qa/rebase-qa-v3-trigger.txt
          git add -A
          git commit -m "chore(qa): remove one-shot rebuild workflow"
          git push origin HEAD:fix/qa-36-remaining-gaps-v2
