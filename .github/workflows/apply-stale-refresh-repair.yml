name: Verify and apply bounded stale refresh repair
on:
  push:
    branches: [fix/stale-refresh-batch-honesty]
    paths:
      - .github/workflows/apply-stale-refresh-repair.yml
      - scripts/apply-stale-refresh-repair.mjs
      - backend/tests/staleMatchExplainRefreshBounds.test.js
      - backend/tests/staleMatchExplainRefreshStatus.test.js
      - backend/tests/staleMatchExplainScheduler.test.js
permissions:
  contents: write
concurrency:
  group: apply-stale-refresh-repair
  cancel-in-progress: true
jobs:
  verify-and-apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=optional
      - name: Prove the missing behavior on unchanged production code
        shell: bash
        run: |
          set +e
          node scripts/run-vitest-isolated.mjs run --reporter=json --outputFile=/tmp/stale-refresh-before.json backend/tests/staleMatchExplainRefreshBounds.test.js backend/tests/staleMatchExplainRefreshStatus.test.js backend/tests/staleMatchExplainScheduler.test.js
          code=$?
          set -e
          test "$code" -ne 0
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const report=JSON.parse(fs.readFileSync('/tmp/stale-refresh-before.json','utf8'));
          assert.equal(report.numTotalTests,14);
          assert.equal(report.numFailedTests,9);
          const failures=report.testResults.flatMap(s=>s.assertionResults??[]).filter(t=>t.status==='failed');
          assert.equal(failures.length,9);
          assert.ok(failures.every(t=>!(t.failureMessages??[]).some(m=>/SyntaxError|Cannot find module|ReferenceError/.test(m))));
          console.log('CONFIRMED_REGRESSION_RED', JSON.stringify({total:report.numTotalTests,failed:report.numFailedTests,passing:report.numPassedTests,failures:failures.map(t=>t.fullName)}));
          NODE
      - name: Apply only the reviewed exact-anchor repair
        id: repair
        shell: bash
        run: |
          if test -f scripts/apply-stale-refresh-repair.mjs; then
            node scripts/apply-stale-refresh-repair.mjs
            echo 'applied=true' >> "$GITHUB_OUTPUT"
          else
            echo 'REGRESSION_BASELINE_ONLY: no implementation applied'
            echo 'applied=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify the repaired dependency chain
        if: steps.repair.outputs.applied == 'true'
        run: |
          node --check backend/services/matching/staleMatchExplainRefresh.js
          node --check backend/startup/enforceInvariants.js
          node --check backend/server.js
          node scripts/run-vitest-isolated.mjs run backend/tests/staleMatchExplainRefreshBounds.test.js backend/tests/staleMatchExplainRefreshStatus.test.js backend/tests/staleMatchExplainScheduler.test.js backend/tests/staleMatchExplainRefresh.test.js backend/tests/enforceInvariants.test.js backend/tests/fourTruthProofRefresh.test.js backend/tests/profileSignalVersion.test.js
          npm run check:prepush
          git diff --check
      - name: Publish validated source changes to this repair branch only
        if: steps.repair.outputs.applied == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          current=$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/fix/stale-refresh-batch-honesty --jq '.object.sha')
          test "$current" = "$EXPECTED_HEAD"
          git add backend/services/matching/staleMatchExplainRefresh.js backend/startup/enforceInvariants.js backend/server.js backend/tests/enforceInvariants.test.js
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(matching): resume bounded stale refresh and preserve failure diagnostics'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:fix/stale-refresh-batch-honesty
          echo "VALIDATED_REPAIR_HEAD=$(git rev-parse HEAD)"
