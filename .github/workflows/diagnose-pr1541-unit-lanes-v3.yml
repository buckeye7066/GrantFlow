name: Diagnose PR 1541 unit lanes and publish report

on:
  push:
    branches: [fix/production-cors-current-main-20260905]
    paths:
      - .github/workflows/diagnose-pr1541-unit-lanes-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-pr1541-unit-lanes-v3
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=optional

      - name: Run each unit lane independently
        id: lanes
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p diagnostics

          UNIT_TEST_CONCURRENCY=2 node scripts/run-unit-tests.mjs > node-unit.log 2>&1
          node_code=$?

          serial_node_code=not_run
          if [ "$node_code" -ne 0 ]; then
            UNIT_TEST_CONCURRENCY=1 node scripts/run-unit-tests.mjs > node-unit-serial.log 2>&1
            serial_node_code=$?
          else
            : > node-unit-serial.log
          fi

          node scripts/run-vitest-isolated.mjs run \
            --exclude "backend/tests/otp*.test.js" \
            --exclude "backend/tests/emailOtpTokenNoVerifier.test.js" \
            > vitest-general.log 2>&1
          general_code=$?

          serial_general_code=not_run
          if [ "$general_code" -ne 0 ]; then
            node scripts/run-vitest-isolated.mjs run \
              --no-file-parallelism \
              --exclude "backend/tests/otp*.test.js" \
              --exclude "backend/tests/emailOtpTokenNoVerifier.test.js" \
              > vitest-general-serial.log 2>&1
            serial_general_code=$?
          else
            : > vitest-general-serial.log
          fi

          node scripts/run-vitest-isolated.mjs run \
            --no-file-parallelism \
            backend/tests/otp \
            backend/tests/emailOtpTokenNoVerifier \
            > vitest-otp.log 2>&1
          otp_code=$?

          {
            echo "# PR 1541 unit-lane diagnosis"
            echo
            echo "Exact source SHA: \`$(git rev-parse HEAD)\`"
            echo
            echo "| Lane | Exit code |"
            echo "|---|---:|"
            echo "| Node unit, concurrency 2 | $node_code |"
            echo "| Node unit, concurrency 1 retry | $serial_node_code |"
            echo "| General Vitest | $general_code |"
            echo "| General Vitest, no file parallelism retry | $serial_general_code |"
            echo "| OTP Vitest, no file parallelism | $otp_code |"
            echo
            echo "## Failure-oriented excerpts"
          } > diagnostics/pr1541-unit-lanes.md

          extract_failure() {
            log="$1"
            label="$2"
            echo >> diagnostics/pr1541-unit-lanes.md
            echo "### $label" >> diagnostics/pr1541-unit-lanes.md
            echo '```text' >> diagnostics/pr1541-unit-lanes.md
            grep -nEi '(^|[[:space:]])(not ok|fail(ed|ure)?|assertionerror|error:|err_|unhandled|test files|tests|timed out|timeout|killed|signal)' "$log" \
              | tail -n 220 >> diagnostics/pr1541-unit-lanes.md || true
            echo >> diagnostics/pr1541-unit-lanes.md
            echo '--- terminal 260 lines ---' >> diagnostics/pr1541-unit-lanes.md
            tail -n 260 "$log" >> diagnostics/pr1541-unit-lanes.md || true
            echo '```' >> diagnostics/pr1541-unit-lanes.md
          }

          extract_failure node-unit.log "Node unit, concurrency 2"
          if [ "$serial_node_code" != not_run ]; then
            extract_failure node-unit-serial.log "Node unit, concurrency 1 retry"
          fi
          extract_failure vitest-general.log "General Vitest"
          if [ "$serial_general_code" != not_run ]; then
            extract_failure vitest-general-serial.log "General Vitest, no file parallelism retry"
          fi
          extract_failure vitest-otp.log "OTP Vitest"

          {
            echo "node_code=$node_code"
            echo "serial_node_code=$serial_node_code"
            echo "general_code=$general_code"
            echo "serial_general_code=$serial_general_code"
            echo "otp_code=$otp_code"
          } >> "$GITHUB_OUTPUT"

          exit 0

      - name: Upload complete lane logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1541-unit-lane-diagnostic-v3
          path: |
            node-unit.log
            node-unit-serial.log
            vitest-general.log
            vitest-general-serial.log
            vitest-otp.log
            diagnostics/pr1541-unit-lanes.md
          retention-days: 2
          if-no-files-found: error

      - name: Publish bounded diagnosis to the branch
        shell: bash
        run: |
          set -euo pipefail
          git add diagnostics/pr1541-unit-lanes.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: publish PR 1541 unit-lane diagnosis"
          git push origin HEAD:fix/production-cors-current-main-20260905
