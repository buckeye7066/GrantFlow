name: CodeQL

on:
  pull_request:
  # Branch pushes are the pre-merge full-scan lane. GitHub's pull_request
  # analysis is diff-informed, so it cannot be compared honestly with the
  # reviewed whole-repository baseline.
  push:
  schedule:
    - cron: "30 8 * * 1"
  workflow_dispatch:

# See ci.yml: supersede in-flight runs per branch, but never on main, whose
# per-commit analysis record must stay complete — main gets a UNIQUE group per
# commit because a shared group's single pending slot still drops runs under
# rapid merges (observed live 2026-07-31).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node 20 for baseline enforcement
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.20.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          # This private repo does not currently have GitHub Advanced Security
          # purchased, so Code Scanning uploads fail with a configuration error.
          # Keep the analysis real, retain SARIF, and enforce the measured baseline.
          upload: never

      - name: Require full-scan SARIF output
        if: github.event_name != 'pull_request'
        env:
          CODEQL_SARIF_OUTPUT: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          if [ -z "$CODEQL_SARIF_OUTPUT" ]; then
            echo "CodeQL analyze did not publish a SARIF output path" >&2
            exit 1
          fi
          if [ ! -e "$CODEQL_SARIF_OUTPUT" ]; then
            echo "CodeQL SARIF output path does not exist: $CODEQL_SARIF_OUTPUT" >&2
            exit 1
          fi

      - name: Enforce reviewed full-scan CodeQL baseline
        if: github.event_name != 'pull_request'
        env:
          CODEQL_SCAN_EVENT: ${{ github.event_name }}
          CODEQL_SCAN_REPOSITORY: ${{ github.repository }}
          CODEQL_SCAN_SHA: ${{ github.sha }}
          CODEQL_SCAN_REF: ${{ github.ref }}
        run: >-
          node scripts/check-codeql-baseline.mjs
          "${{ steps.analyze.outputs.sarif-output }}"
          .github/codeql-baseline.json

      - name: Retain CodeQL SARIF artifact
        if: always() && steps.analyze.outputs.sarif-output != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif
          path: ${{ steps.analyze.outputs.sarif-output }}
          if-no-files-found: warn
          retention-days: 30
