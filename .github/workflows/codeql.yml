name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 8 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    # Main-branch runs were taking ~15m23s and getting CANCELLED at the old
    # 15-minute timeout — security scanning was silently dying. PR runs finish
    # ~13m; 25 gives headroom without letting a hang burn an hour.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          # This private repo does not currently have GitHub Advanced Security
          # purchased, so Code Scanning uploads fail with a configuration error.
          # Keep the analysis real and preserve SARIF as a workflow artifact.
          upload: never

      - name: Retain CodeQL SARIF artifact
        if: always() && steps.analyze.outputs.sarif-output != ''
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: ${{ steps.analyze.outputs.sarif-output }}
          if-no-files-found: warn
          retention-days: 30
