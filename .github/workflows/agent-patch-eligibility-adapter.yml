name: Wire eligibility confirmation policy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/eligibility-unconfirmed-cap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/eligibility-unconfirmed-cap
          fetch-depth: 0

      - name: Patch need-first scoring adapter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/services/matching/needFirstScoringAdapter.js')
          text = path.read_text(encoding='utf-8')

          import_anchor = """import {
            enforceNeedFirstDecision,
            evaluateNeedFirstMatchPolicy,
          } from './needFirstMatchPolicy.js'
          """
          import_anchor = '\n'.join(line[10:] if line.startswith('          ') else line for line in import_anchor.splitlines()) + '\n'
          import_line = "import { applyEligibilityConfirmationPolicy } from './eligibilityConfirmation.js'\n"
          if import_line not in text:
            if text.count(import_anchor) != 1:
              raise SystemExit(f'need-first import anchor count={text.count(import_anchor)}')
            text = text.replace(import_anchor, import_anchor + import_line, 1)

          resource_anchor = """  if (policy.resource) {
            decisionResult.decision = 'REVIEW'
            decisionResult.explanation = canonical?.explanation ??
              'Resource retained as a search aid; it is not a direct funding award.'
          }

          const previousExplain = canonical?.match_explain ?? {}
          """
          resource_anchor = '\n'.join(line[10:] if line.startswith('          ') else line for line in resource_anchor.splitlines()) + '\n'
          resource_replacement = """  if (policy.resource) {
            decisionResult.decision = 'REVIEW'
            decisionResult.explanation = canonical?.explanation ??
              'Resource retained as a search aid; it is not a direct funding award.'
          }

          const eligibilityPolicy = applyEligibilityConfirmationPolicy({
            canonical,
            score,
            decision: decisionResult.decision,
            explanation: decisionResult.explanation,
            reasons: decisionResult.reasons,
            resource: policy.resource,
          })
          score = eligibilityPolicy.score
          decisionResult.decision = eligibilityPolicy.decision
          decisionResult.explanation = eligibilityPolicy.explanation
          decisionResult.reasons = eligibilityPolicy.reasons
          const directEligibilityUnconfirmed =
            eligibilityPolicy.confirmation.unconfirmed && !policy.resource

          const previousExplain = canonical?.match_explain ?? {}
          """
          resource_replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in resource_replacement.splitlines()) + '\n'
          if 'const eligibilityPolicy = applyEligibilityConfirmationPolicy' not in text:
            if text.count(resource_anchor) != 1:
              raise SystemExit(f'resource anchor count={text.count(resource_anchor)}')
            text = text.replace(resource_anchor, resource_replacement, 1)

          explain_anchor = "    scoring_policy_version: NEED_FIRST_SCORING_VERSION,\n    dataPointEvidence: {"
          explain_replacement = """    scoring_policy_version: NEED_FIRST_SCORING_VERSION,
            eligibility_confirmation: {
              confirmed: !directEligibilityUnconfirmed,
              unconfirmed: directEligibilityUnconfirmed,
              missing_fields: eligibilityPolicy.confirmation.missingFields,
              all_missing_fields: eligibilityPolicy.confirmation.allMissingFields,
              score_cap: directEligibilityUnconfirmed
                ? eligibilityPolicy.confirmation.scoreCap
                : null,
              applied: eligibilityPolicy.applied,
            },
            eligibility_unconfirmed: directEligibilityUnconfirmed,
            dataPointEvidence: {"""
          explain_replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in explain_replacement.splitlines())
          if 'eligibility_confirmation: {' not in text:
            if text.count(explain_anchor) != 1:
              raise SystemExit(f'explain anchor count={text.count(explain_anchor)}')
            text = text.replace(explain_anchor, explain_replacement, 1)

          breakdown_anchor = "      need_first_hard_mismatch: policy.hardMismatch,\n      data_point_bonus_credit:"
          breakdown_replacement = """      need_first_hard_mismatch: policy.hardMismatch,
            eligibility_unconfirmed: directEligibilityUnconfirmed,
            eligibility_unconfirmed_score_cap: directEligibilityUnconfirmed
              ? eligibilityPolicy.confirmation.scoreCap
              : null,
            eligibility_confirmation_applied: eligibilityPolicy.applied,
            data_point_bonus_credit:"""
          breakdown_replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in breakdown_replacement.splitlines())
          if 'eligibility_confirmation_applied:' not in text:
            if text.count(breakdown_anchor) != 1:
              raise SystemExit(f'breakdown anchor count={text.count(breakdown_anchor)}')
            text = text.replace(breakdown_anchor, breakdown_replacement, 1)

          return_anchor = """    matcherVersion: canonical?.matcherVersion ?? NEED_FIRST_SCORING_VERSION,
            scoringPolicyVersion: NEED_FIRST_SCORING_VERSION,
          }
          """
          return_anchor = '\n'.join(line[10:] if line.startswith('          ') else line for line in return_anchor.splitlines()) + '\n'
          return_replacement = """    matcherVersion: canonical?.matcherVersion ?? NEED_FIRST_SCORING_VERSION,
            scoringPolicyVersion: NEED_FIRST_SCORING_VERSION,
            eligibilityConfirmed: !directEligibilityUnconfirmed,
            eligibilityUnconfirmed: directEligibilityUnconfirmed,
          }
          """
          return_replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in return_replacement.splitlines()) + '\n'
          if 'eligibilityUnconfirmed: directEligibilityUnconfirmed' not in text:
            if text.count(return_anchor) != 1:
              raise SystemExit(f'return anchor count={text.count(return_anchor)}')
            text = text.replace(return_anchor, return_replacement, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/agent-patch-eligibility-adapter.yml').unlink()
          PY

      - name: Commit adapter wiring
        shell: bash
        run: |
          git config user.name "GrantFlow Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend/services/matching/needFirstScoringAdapter.js .github/workflows/agent-patch-eligibility-adapter.yml
          git commit -m "fix(scoring): enforce eligibility-unconfirmed cap in need-first adapter"
          git push origin HEAD:fix/eligibility-unconfirmed-cap
