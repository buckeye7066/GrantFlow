name: One-shot PR 1179 sync main

on:
  push:
    branches:
      - fix/match-authority-soft-penalty-and-display-parity

permissions:
  contents: write

jobs:
  sync-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[sync-main-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout matching branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/match-authority-soft-penalty-and-display-parity
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.20.2
          cache: npm

      - name: Merge current main locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GrantFlow Match Repair"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Verify environment contracts
        run: node scripts/check-env-examples.mjs

      - name: Run focused matching and display regressions
        run: >-
          node scripts/run-vitest-isolated.mjs run
          backend/tests/matchEngineSoftRelevanceAndMatchFunds.test.js
          backend/tests/matchThresholdsSoftPenalty.test.js
          backend/tests/relevanceFilter.softMode.test.js
          backend/tests/relevanceFilterRules.test.js
          backend/tests/opportunityNormalizerEligibilityText.test.js
          tests/unit/discoverCatalogKeep.test.js

      - name: Run repository pre-push gates
        run: npm run check:prepush

      - name: Remove one-shot workflow and publish verified sync
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-pr1179-sync-main.yml
          git commit -m "chore(match): verify against current main [sync-main-complete]"
          git push origin HEAD:fix/match-authority-soft-penalty-and-display-parity
