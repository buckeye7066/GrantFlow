name: ChatGPT GrantFlow avatar hardening

on:
  push:
    branches:
      - chatgpt/production-ready/grantflow
    paths:
      - scripts/one-shot-grantflow-avatar-hardening.mjs
      - scripts/run-one-shot-grantflow-avatar-hardening.mjs
      - .github/workflows/chatgpt-grantflow-avatar-hardening.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout production branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: chatgpt/production-ready/grantflow
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=optional

      - name: Apply guarded transformation
        run: node scripts/run-one-shot-grantflow-avatar-hardening.mjs

      - name: Verify intended file scope
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(backend/services/http/safeFetch\.js|backend/services/avatarCrawler\.js|backend/tests/safeFetchSsrf\.test\.js|backend/tests/avatarCrawlerSsrf\.test\.js)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected transformed files:"
            echo "$unexpected"
            exit 1
          fi
          git diff --check

      - name: Lint changed source and tests
        run: npx eslint --max-warnings 0 backend/services/http/safeFetch.js backend/services/avatarCrawler.js backend/tests/safeFetchSsrf.test.js backend/tests/avatarCrawlerSsrf.test.js

      - name: Run focused security regressions
        run: node scripts/run-vitest-isolated.mjs run backend/tests/safeFetchSsrf.test.js backend/tests/avatarCrawlerSsrf.test.js

      - name: Run website-cover integration regressions
        run: node --test tests/unit/avatar-website-cover.test.mjs

      - name: Remove one-shot scaffolding and commit verified result
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/one-shot-grantflow-avatar-hardening.mjs
          rm scripts/run-one-shot-grantflow-avatar-hardening.mjs
          rm .github/workflows/chatgpt-grantflow-avatar-hardening.yml
          git diff --check
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add backend/services/http/safeFetch.js \
                  backend/services/avatarCrawler.js \
                  backend/tests/safeFetchSsrf.test.js \
                  backend/tests/avatarCrawlerSsrf.test.js \
                  scripts/one-shot-grantflow-avatar-hardening.mjs \
                  scripts/run-one-shot-grantflow-avatar-hardening.mjs \
                  .github/workflows/chatgpt-grantflow-avatar-hardening.yml
          git commit -m 'fix(security): pin avatar egress and cap response bodies [chatgpt-one-shot-done]'
          git push origin HEAD:chatgpt/production-ready/grantflow
