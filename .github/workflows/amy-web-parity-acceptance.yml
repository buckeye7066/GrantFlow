name: amy-web-parity-acceptance

# Manual, isolated release evidence. The acceptance runner scrubs every database
# variable, migrates a disposable SQLite database, and deletes its exact-50 Amy
# cohort before publishing the sanitized receipt.
on:
  workflow_dispatch:
    inputs:
      allowed_providers:
        description: 'Comma-separated reliable search providers to permit'
        required: true
        default: 'google_cse,searxng,brave,openai_web_search'
        type: string

permissions:
  contents: read

concurrency:
  group: amy-web-parity-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    name: Exact-50 Amy and web parity
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
      GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
      RECEIPT: audit-reports/amy-web-parity-${{ github.run_id }}.json

    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up the acceptance Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run isolated exact-50 acceptance
        id: acceptance
        continue-on-error: true
        env:
          ALLOWED_PROVIDERS: ${{ inputs.allowed_providers }}
        run: |
          node scripts/grantflow-acceptance-50.mjs \
            --expected-sha="$(git rev-parse HEAD)" \
            --output="$RECEIPT" \
            --allowed-providers="$ALLOWED_PROVIDERS"

      # A failed/blocked receipt is still the evidence needed to name the exact
      # provider, cohort, parity, policy, or cleanup blocker. Upload it first,
      # then preserve a red workflow result.
      - name: Upload immutable acceptance receipt
        if: ${{ always() && hashFiles(env.RECEIPT) != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: amy-web-parity-acceptance-${{ github.run_id }}
          path: ${{ env.RECEIPT }}
          if-no-files-found: error
          retention-days: 30

      - name: Require acceptance to pass
        if: ${{ steps.acceptance.outcome != 'success' }}
        run: |
          echo 'Amy/web-parity acceptance did not pass; inspect the uploaded sanitized receipt.' >&2
          exit 1
