name: Repair PR 1536 concurrency guards

on:
  push:
    branches: [fix/vnext-transition-integrity-current-main-20260904]
    paths:
      - .github/workflows/export-chatgpt-pr1536.yml
      - scripts/repair_pr1536.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vnext-transition-integrity-current-main-20260904
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply guarded repairs
        run: node scripts/repair_pr1536.mjs
      - name: Install exact dependencies
        run: npm ci
      - name: Run focused regressions
        run: npx vitest run backend/tests/vnextApplicationGuidance.test.js backend/tests/vnextStateMachineIntegrity.test.js --reporter=dot
      - name: Validate syntax and diff
        run: |
          node --check backend/services/opportunityMatcher.js
          node --check backend/vnext/stateMachine.js
          git diff --check
      - name: Commit repaired product files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/services/opportunityMatcher.js backend/vnext/stateMachine.js backend/tests/vnextApplicationGuidance.test.js backend/tests/vnextStateMachineIntegrity.test.js
          git commit -m 'fix: bind guidance and retries to authoritative identity'
          git push origin HEAD:fix/vnext-transition-integrity-current-main-20260904
