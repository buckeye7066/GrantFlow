name: One-shot regenerate env examples

on:
  push:
    branches:
      - fix/regenerate-env-examples
    paths:
      - .github/workflows/one-shot-regenerate-env-examples.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/regenerate-env-examples
          fetch-depth: 0

      - name: Set up repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0

      - name: Regenerate canonical examples and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-env-examples.mjs
          rm .github/workflows/one-shot-regenerate-env-examples.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example backend/.env.example .github/workflows/one-shot-regenerate-env-examples.yml
          git diff --cached --check
          git commit -m "fix(config): regenerate canonical env examples"
          git push origin HEAD:fix/regenerate-env-examples
